<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-labelledby="title desc">
  <title id="title">Ascout Scout Frame mark</title>
  <desc id="desc">A modular A inside four focus-frame corners, representing exact scope and evidence.</desc>
  <g fill="currentColor">
    <!-- focus frame -->
    <rect x="4" y="4" width="16" height="4"/>
    <rect x="4" y="4" width="4" height="16"/>
    <rect x="44" y="4" width="16" height="4"/>
    <rect x="56" y="4" width="4" height="16"/>
    <rect x="4" y="56" width="16" height="4"/>
    <rect x="4" y="44" width="4" height="16"/>
    <rect x="44" y="56" width="16" height="4"/>
    <rect x="56" y="44" width="4" height="16"/>

    <!-- modular A -->
    <rect x="28" y="14" width="8" height="6"/>
    <rect x="22" y="20" width="8" height="8"/>
    <rect x="34" y="20" width="8" height="8"/>
    <rect x="18" y="28" width="8" height="8"/>
    <rect x="38" y="28" width="8" height="8"/>
    <rect x="16" y="36" width="8" height="12"/>
    <rect x="40" y="36" width="8" height="12"/>
    <rect x="24" y="34" width="16" height="6"/>

    <!-- evidence cell -->
    <rect x="28" y="44" width="8" height="8"/>
  </g>
</svg>
