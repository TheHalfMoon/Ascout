# Ascout PR Publish, GitHub App mode (C1). A template: copy it to .github/workflows/ in your
# repository *instead of* ascout-pr-publish.yml, after following "GitHub App mode" in
# docs/GITHUB_INTEGRATION.md. Design: specs/017-unified-assurance/C1_GITHUB_APP_GATE_DESIGN.md.
#
# Why this job is shaped like this:
# - It holds the App's private key, so it installs nothing and builds nothing: no npm, no
#   third-party actions. It runs Ascout's dependency-free entry point from a pinned release whose
#   SHA-256 is checked before anything runs.
# - The key comes from the `ascout-publish` environment, which must allow exactly your default
#   branch ("Selected branches and tags"). This must be the only workflow that names it.
# - It runs on workflow_run, so it is always your default branch's copy of this file.
# - The evidence bundle from the collect job is untrusted data: downloaded, validated, never run.
# - The publish step's standard output must reach the runner directly (no capture, pipe, or
#   redirect): that is where the ::add-mask:: commands for the JWT and installation token go.
name: Ascout PR Publish

on:
  workflow_run:
    workflows: ["Ascout PR Collect"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    name: ascout publish (GitHub App)
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.path == '.github/workflows/ascout-pr-collect.yml' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ascout-publish
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the default branch's .github folder (for the team policy only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Download and verify the pinned Ascout release
        env:
          # Set both from the release you have reviewed; the digest is in the release's SHA256SUMS.
          ASCOUT_VERSION: "REPLACE_WITH_VERSION"
          ASCOUT_SHA256: "REPLACE_WITH_SHA256"
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/TheHalfMoon/Ascout/releases/download/v${ASCOUT_VERSION}/thehalfmoon-ascout-${ASCOUT_VERSION}.tgz"
          curl --fail --silent --show-error --location --proto '=https' --output "$RUNNER_TEMP/ascout.tgz" "$url"
          echo "${ASCOUT_SHA256}  $RUNNER_TEMP/ascout.tgz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/ascout.tgz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/package/dist/github/publish-cli.js"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ascout-pr-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/evidence
      - name: Publish the Check Run and summary comment as the GitHub App
        env:
          ASCOUT_APP_ID: ${{ secrets.ASCOUT_APP_ID }}
          ASCOUT_APP_CLIENT_ID: ${{ secrets.ASCOUT_APP_CLIENT_ID }}
          ASCOUT_APP_PRIVATE_KEY: ${{ secrets.ASCOUT_APP_PRIVATE_KEY }}
          ASCOUT_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ASCOUT_PR_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          ASCOUT_PR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ASCOUT_PR_DETAILS_URL: ${{ github.event.workflow_run.html_url }}
          ASCOUT_PR_TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          ASCOUT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          ASCOUT_PR_REQUIRED_BASE: ${{ github.event.repository.default_branch }}
          ASCOUT_PR_TRUSTED_ACTORS: ${{ vars.ASCOUT_PR_TRUSTED_ACTORS }}
        shell: bash
        run: node "$RUNNER_TEMP/package/dist/github/publish-cli.js" "$RUNNER_TEMP/evidence/ascout-pr-evidence.json"
