name: T072 revision governance repair

on:
  push:
    branches:
      - repair/t072-revision-governance-4e4de441

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/072-benchmark-manifest
          fetch-depth: 0

      - name: Opening exact-head guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4e4de44134f13cc3aa61fd50f0190ecfd8263b96"
          test -z "$(git status --short)"
          test "$(git merge-base d4a9694f722acb9657c92b90f0d1832a295e3a3e HEAD)" = "d4a9694f722acb9657c92b90f0d1832a295e3a3e"

      - name: Add revision governance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('benchmarks/manifest.json')
          d = json.loads(path.read_text())
          assert d['manifest_revision'] == 1
          assert d['cases'] == []
          c = d['case_collection_contract']
          for key in [
              'case_definition_required_state',
              'manifest_revision_bump_required_on_case_set_change',
              'case_revision_bump_required_on_identity_or_semantic_change',
          ]:
              assert key not in c
          c['case_definition_required_state'] = 'CASE_REVIEWED'
          c['manifest_revision_bump_required_on_case_set_change'] = True
          c['case_revision_bump_required_on_identity_or_semantic_change'] = True
          path.write_text(json.dumps(d, indent=2) + '\n')
          PY
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "benchmarks/manifest.json "

      - name: Revision governance contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('benchmarks/manifest.json').read_text())
          c = d['case_collection_contract']
          assert d['manifest_revision'] == 1
          assert d['cases'] == []
          assert c['case_definition_required_state'] == 'CASE_REVIEWED'
          assert c['manifest_revision_bump_required_on_case_set_change'] is True
          assert c['case_revision_bump_required_on_identity_or_semantic_change'] is True
          assert 'CASE_REVIEWED' in d['case_schema']['properties']['lifecycle_state']['enum']
          PY

      - name: Commit and push repaired product head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add benchmarks/manifest.json
          git commit -m "fix(benchmark): govern T072 manifest revisions"
          git push origin HEAD:feat/072-benchmark-manifest
