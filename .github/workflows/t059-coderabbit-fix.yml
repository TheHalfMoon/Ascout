name: T059 CodeRabbit repair

on:
  push:
    branches:
      - mutate/t059-coderabbit-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mutation helper
        uses: actions/checkout@v4
        with:
          ref: mutate/t059-coderabbit-fix
          fetch-depth: 0

      - name: Preserve patch script and switch to exact feature branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/t059-coderabbit-fix.py /tmp/t059-coderabbit-fix.py
          git fetch origin feat/059-flake-contract-tests
          git checkout -B feat/059-flake-contract-tests origin/feat/059-flake-contract-tests
          test "$(git rev-parse HEAD)" = "6fdc526facf1c0e3b1c969de0ff0abc590333efa"
          test -z "$(git status --porcelain)"

      - name: Apply review repair
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/t059-coderabbit-fix.py
          git diff --check
          git diff -- src/receipt/model.ts tests/flake-reproduction.contract.test.ts

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Provision exact locked dependencies
        run: npm ci

      - name: Run focused repair tests
        run: >-
          npm test --
          tests/flake-reproduction.contract.test.ts
          tests/receipt-model.test.ts
          tests/task-status.contract.test.ts
          tests/receipt-v1.semantic-invariants.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit and push feature repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/receipt/model.ts tests/flake-reproduction.contract.test.ts
          test "$(git diff --cached --name-only)" = $'src/receipt/model.ts\ntests/flake-reproduction.contract.test.ts'
          git commit -m "fix(m1): preserve aggregate task flake truth"
          git push origin HEAD:feat/059-flake-contract-tests
