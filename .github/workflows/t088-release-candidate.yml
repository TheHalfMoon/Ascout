name: T088 Release Candidate Rehearsal

on:
  push:
    branches:
      - release/088-clean-candidate-rehearsal

permissions:
  contents: read

jobs:
  diagnose-windows-coverage:
    name: t088 diagnostic / windows-2025 / node-22
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: a8b9cfec67bb442edccc2035829e75bc9ebd2d91
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Probe Windows temp path canonicalization
        run: node -e "const fs=require('node:fs'),os=require('node:os'),path=require('node:path');const d=fs.mkdtempSync(path.join(os.tmpdir(),'ascout-realpath-'));console.log('ASCOUT_T088_REALPATH '+JSON.stringify({tmp:os.tmpdir(),directory:d,real:fs.realpathSync(d),native:fs.realpathSync.native(d)}));fs.rmSync(d,{recursive:true,force:true});"

      - name: Instrument coverage execution context
        shell: pwsh
        run: |
          $needle = 'expect(receipt.selection.limitations).not.toContain(UNSAFE_SELECTION_LIMITATION);'
          $diagnostic = 'console.error("ASCOUT_T088_CONTEXT " + JSON.stringify({root, cwd: process.cwd(), artifacts: receipt.artifacts.filter((artifact) => artifact.task_id === "test").map((artifact) => ({id: artifact.artifact_id, path: artifact.relative_run_path, text: readFileSync(join(root, ".ascout", "runs", receipt.run.run_id, artifact.relative_run_path), "utf8")})), task: receipt.tasks.find((task) => task.task_type === "test")}, null, 2));'
          foreach ($file in @('tests/vitest-check.integration.test.ts', 'tests/jest-check.integration.test.ts')) {
            $text = Get-Content -Raw $file
            if (-not $text.Contains($needle)) { throw "diagnostic needle missing in $file" }
            $replacement = $diagnostic + [Environment]::NewLine + '      ' + $needle
            Set-Content -Path $file -Value $text.Replace($needle, $replacement) -Encoding utf8
          }

      - name: Focused pair
        continue-on-error: true
        run: npx vitest run tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism

      - name: Restore exact candidate
        if: ${{ !cancelled() }}
        run: |
          git reset --hard $env:CANDIDATE_SHA
          git clean -fd
          node -e "const cp=require('node:child_process');const s=cp.execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'});if(s!=='')throw new Error('diagnostic restore failed: '+JSON.stringify(s));console.log('diagnostic source restored')"
