name: T088 Release Candidate Rehearsal

on:
  push:
    branches:
      - release/088-clean-candidate-rehearsal

permissions:
  contents: read

jobs:
  rehearse:
    name: t088 / ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
        node:
          - "22"
          - "24"
    env:
      CANDIDATE_SHA: d7bb3a416f2eb3b2b4cf89c74d2a5cd97275c9bf
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Guard exact clean source
        run: >-
          node -e "const cp=require('node:child_process');const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(head!==process.env.CANDIDATE_SHA)throw new Error('candidate mismatch: '+head);const s=cp.execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'});if(s!=='')throw new Error('candidate checkout not clean: '+JSON.stringify(s));console.log('candidate='+head);console.log('tree='+cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim());console.log(process.platform,process.arch,process.version)"

      - name: Environment versions
        run: |
          git --version
          node --version
          npm --version

      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Diagnose Windows native-related selection accounting
        if: ${{ matrix.os == 'windows-2025' }}
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node -e "const fs=require('node:fs');for(const f of ['tests/vitest-check.integration.test.ts','tests/jest-check.integration.test.ts']){let s=fs.readFileSync(f,'utf8');const needle='expect(receipt.selection.limitations).not.toContain(UNSAFE_SELECTION_LIMITATION);';const replacement='console.error(JSON.stringify({diagnostic_file:'+JSON.stringify(f)+',selection:receipt.selection,summary:receipt.summary,test_task:receipt.tasks.find((task)=>task.task_type===\"test\")},null,2));\n      '+needle;if(!s.includes(needle))throw new Error('diagnostic needle missing in '+f);fs.writeFileSync(f,s.replace(needle,replacement),'utf8');}"
          npx vitest run tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism
          git reset --hard $env:CANDIDATE_SHA

      - name: Restore exact candidate after diagnostics
        if: ${{ matrix.os == 'windows-2025' && !cancelled() }}
        run: |
          git reset --hard $env:CANDIDATE_SHA
          git clean -fd

      - name: Typecheck
        run: npm run typecheck

      - name: Full test suite serialized for contention diagnosis
        id: full_tests
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test -- --no-file-parallelism

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Focused release-hardening contracts
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/process-control.test.ts tests/windows-command-separator.process-control.test.ts tests/t081-cross-platform-receipt-golden.test.ts tests/npm-package-content.test.ts

      - name: Inspect actual package manifest without publishing
        if: ${{ !cancelled() }}
        run: >-
          node -e "const cp=require('node:child_process');const r=cp.spawnSync('npm',['pack','--dry-run','--json','--ignore-scripts'],{encoding:'utf8',shell:true});if(r.status!==0)throw new Error(r.stderr||'npm pack dry-run failed');const a=JSON.parse(r.stdout);if(!Array.isArray(a)||a.length!==1)throw new Error('unexpected pack json');const p=a[0];if(p.name!=='@thehalfmoon/ascout'||p.version!=='0.0.0')throw new Error('package identity mismatch');const names=new Set((p.files||[]).map(x=>x.path));for(const required of ['package.json','README.md','LICENSE','dist/cli.js'])if(!names.has(required))throw new Error('missing '+required);for(const forbidden of ['src/','tests/','specs/','benchmarks/','.ascout/','coverage/'])for(const name of names)if(name===forbidden.slice(0,-1)||name.startsWith(forbidden))throw new Error('forbidden package path '+name);console.log(JSON.stringify({name:p.name,version:p.version,file_count:names.size,size:p.size,unpackedSize:p.unpackedSize}))"

      - name: Verify T078 published selector-miss truth
        if: ${{ !cancelled() }}
        run: >-
          node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('benchmarks/results/t078-selector-misses.json','utf8'));if(x.task!=='T078')throw new Error('wrong benchmark task');if(x.threshold_policy?.acceptance_threshold!==null)throw new Error('T078 must retain null pre-data threshold');if(!Array.isArray(x.selector_misses)||x.selector_misses.length!==1||x.selector_misses[0]?.case_id!=='react-hook-form-value-as-date')throw new Error('published selector-miss truth mismatch');if(x.summary?.published_selector_miss_count!==1)throw new Error('selector miss total mismatch');console.log('t078 selector-miss publication and null-threshold policy verified')"

      - name: CLI startup contract
        if: ${{ !cancelled() }}
        run: >-
          node -e "const cp=require('node:child_process');const r=cp.spawnSync(process.execPath,['dist/cli.js'],{encoding:'utf8'});if(r.status===0)throw new Error('CLI without command unexpectedly succeeded');const out=(r.stdout||'')+(r.stderr||'');if(!/init|doctor|check/i.test(out))throw new Error('CLI usage surface missing');console.log('usage_exit='+r.status)"

      - name: Guard final tracked source cleanliness
        if: ${{ !cancelled() }}
        run: >-
          node -e "const cp=require('node:child_process');const s=cp.execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'});if(s!=='')throw new Error('release rehearsal drifted tracked/included source: '+JSON.stringify(s));console.log('final source clean')"

      - name: Enforce full-suite result
        if: ${{ !cancelled() }}
        env:
          FULL_TEST_OUTCOME: ${{ steps.full_tests.outcome }}
        run: >-
          node -e "if(process.env.FULL_TEST_OUTCOME!=='success')throw new Error('full test suite outcome='+process.env.FULL_TEST_OUTCOME)"
