name: T088 Release Candidate Rehearsal

on:
  push:
    branches:
      - release/088-clean-candidate-rehearsal

permissions:
  contents: read

jobs:
  diagnose-windows-lcov:
    name: t088 diagnostic / windows-2025 / node-22
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: d7bb3a416f2eb3b2b4cf89c74d2a5cd97275c9bf
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Instrument LCOV diagnostics
        shell: pwsh
        run: |
          $needle = 'expect(receipt.selection.limitations).not.toContain(UNSAFE_SELECTION_LIMITATION);'
          $diagnostic = 'const diagnosticCoverageArtifact = receipt.artifacts.find((artifact) => artifact.artifact_id === "test.lcov"); if (diagnosticCoverageArtifact !== undefined) { const diagnosticLcov = readFileSync(join(root, ".ascout", "runs", receipt.run.run_id, diagnosticCoverageArtifact.relative_run_path), "utf8"); console.error("ASCOUT_T088_LCOV\n" + diagnosticLcov); console.error("ASCOUT_T088_NORMALIZED " + JSON.stringify(normalizeLcovLineCoverage(diagnosticLcov, root))); } console.error("ASCOUT_T088_TASK " + JSON.stringify(receipt.tasks.find((task) => task.task_type === "test")));'
          foreach ($file in @('tests/vitest-check.integration.test.ts', 'tests/jest-check.integration.test.ts')) {
            $text = Get-Content -Raw $file
            if (-not $text.Contains($needle)) { throw "diagnostic needle missing in $file" }
            $replacement = $diagnostic + [Environment]::NewLine + '      ' + $needle
            Set-Content -Path $file -Value $text.Replace($needle, $replacement) -Encoding utf8
          }

      - name: Focused pair attempt 1
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism

      - name: Focused pair attempt 2
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism

      - name: Focused pair attempt 3
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism

      - name: Restore exact candidate
        if: ${{ !cancelled() }}
        run: |
          git reset --hard $env:CANDIDATE_SHA
          git clean -fd
          node -e "const cp=require('node:child_process');const s=cp.execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'});if(s!=='')throw new Error('diagnostic restore failed: '+JSON.stringify(s));console.log('diagnostic source restored')"
