name: T088 Release Candidate Rehearsal

on:
  push:
    branches:
      - release/088-clean-candidate-rehearsal

permissions:
  contents: read

jobs:
  diagnose-windows-selection:
    name: t088 diagnostic / windows-2025 / node-22
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CANDIDATE_SHA: d7bb3a416f2eb3b2b4cf89c74d2a5cd97275c9bf
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          clean: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Instrument receipt diagnostics
        run: >-
          node -e "const fs=require('node:fs');for(const f of ['tests/vitest-check.integration.test.ts','tests/jest-check.integration.test.ts']){let s=fs.readFileSync(f,'utf8');const needle='expect(receipt.selection.limitations).not.toContain(UNSAFE_SELECTION_LIMITATION);';const replacement='console.error(\"ASCOUT_T088_DIAGNOSTIC \"+JSON.stringify({diagnostic_file:'+JSON.stringify(f)+',selection:receipt.selection,summary:receipt.summary,test_task:receipt.tasks.find((task)=>task.task_type===\"test\")}));\n      '+needle;if(!s.includes(needle))throw new Error('diagnostic needle missing in '+f);fs.writeFileSync(f,s.replace(needle,replacement),'utf8');}"

      - name: Baseline focused pair
        env:
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism

      - name: Run suspected predecessors then focused pair in one worker
        continue-on-error: true
        env:
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/git-tree-digest.test.ts tests/pr41-p0-regressions.contract.test.ts tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts --no-file-parallelism

      - name: Restore exact candidate
        if: ${{ !cancelled() }}
        run: |
          git reset --hard $env:CANDIDATE_SHA
          git clean -fd
          node -e "const cp=require('node:child_process');const s=cp.execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'});if(s!=='')throw new Error('diagnostic restore failed: '+JSON.stringify(s));console.log('diagnostic source restored')"
