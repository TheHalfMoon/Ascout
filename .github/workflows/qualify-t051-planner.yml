name: Ephemeral T051 planner qualification

on:
  push:
    branches:
      - qualify/t051-planner-155b9f25

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Checkout exact T051 planner candidate
        shell: bash
        env:
          TARGET_SHA: 155b9f25a6ed2fe11c1b03d9401f521e40ced504
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run T051 planner contract
        run: npm test -- tests/vitest-task.contract.test.ts
      - name: Typecheck planner slice
        run: npm run typecheck
