name: T075 Immer determinism diagnostic f6708304
on:
  push:
    branches:
      - diagnostic/t075-immer-determinism-f6708304
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f6708304fb5941cb85f7411f58ab6d3409d20e51
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'f6708304fb5941cb85f7411f58ab6d3409d20e51'
          git fetch https://github.com/TheHalfMoon/Ascout.git main
          test "$(git rev-parse FETCH_HEAD)" = 'eecdd3f5be693f4fa5d607790090836a3158014f'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Build controller
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Provision donor package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install --global yarn@1.22.22 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v24.15.0'
          test "$(yarn --version)" = '1.22.22'
      - name: Expose exact semantic difference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('benchmarks/run.mjs')
          s = p.read_text()
          old = '    if (deterministic !== "deterministic") fail("oracle_flake", `${caseRecord.case_id} observations are ${deterministic}`);'
          new = '''    if (deterministic !== "deterministic") {
            const stable = observations.map(stableObservation);
            const keys = [...new Set(stable.flatMap((item) => Object.keys(item)))].sort();
            for (const key of keys) {
              const values = stable.map((item) => canonicalJson(item[key]));
              if (!values.every((value) => value === values[0])) {
                process.stderr.write(`T075_DIAG_TOP_KEY=${key}\\n`);
                for (let index = 0; index < stable.length; index += 1) {
                  process.stderr.write(`T075_DIAG_${key.toUpperCase()}_${index + 1}=${Buffer.from(values[index], "utf8").toString("base64")}\\n`);
                }
              }
            }
            fail("oracle_flake", `${caseRecord.case_id} observations are ${deterministic}`);
          }'''
          if old not in s:
              raise SystemExit('guarded diagnostic patch target missing')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check benchmarks/run.mjs
          set +e
          node benchmarks/run.mjs \
            --case immer-prototype-undefined \
            --run-id "diagnostic:${GITHUB_RUN_ID}:immer" \
            --repetitions 2 \
            > "$RUNNER_TEMP/immer.out" 2> "$RUNNER_TEMP/immer.err"
          code=$?
          set -e
          echo "HARNESS_EXIT=$code"
          grep '^T075_DIAG_' "$RUNNER_TEMP/immer.err" || true
          tail -n 20 "$RUNNER_TEMP/immer.err" || true
          test "$code" -ne 0
