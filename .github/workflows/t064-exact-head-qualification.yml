name: T064 exact-head qualification

on:
  push:
    branches:
      - qualification/t064-exact-head-563ef136

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact T064 head
        uses: actions/checkout@v4
        with:
          ref: 563ef13645073592995a58421333343f26073d44
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prove opening exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "563ef13645073592995a58421333343f26073d44"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git status --short
      - name: Provision exact locked dependencies
        run: npm ci
      - name: Run focused T064 qualification
        run: npm test -- tests/test-reproduction-normalization.contract.test.ts tests/flake-reproduction.contract.test.ts tests/flake-run-check.integration.test.ts tests/targeted-test-rerun.contract.test.ts tests/vitest-check.integration.test.ts tests/jest-check.integration.test.ts tests/receipt-model.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run full test suite
        run: npm test
      - name: Prove closing exact head and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "563ef13645073592995a58421333343f26073d44"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git status --short --untracked-files=no
