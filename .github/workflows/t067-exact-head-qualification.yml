name: T067 exact-head qualification

on:
  push:
    branches:
      - qualification/t067-exact-head-7af7a19c

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: 7af7a19cb4f93f27d9ab9e73daea753d916dc829
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Opening exact-head guard
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "7af7a19cb4f93f27d9ab9e73daea753d916dc829"
          test -z "$(git status --porcelain)"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused T067 tests
        run: >-
          npx vitest run
          tests/cross-format-consistency.contract.test.ts
          tests/agent-receipt.contract.test.ts
          tests/receipt-terminal.contract.test.ts
          tests/receipt-json.test.ts
          tests/receipt-v1.semantic-invariants.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Full test suite
        run: npm test

      - name: Closing exact-head guard
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "7af7a19cb4f93f27d9ab9e73daea753d916dc829"
          git diff --exit-code
          git diff --cached --exit-code
