name: Ephemeral T051 repaired exact-head qualification

on:
  push:
    branches:
      - qualify/t051-c22114b

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Checkout exact repaired T051 candidate
        shell: bash
        env:
          TARGET_SHA: c22114b789ec37fd18dc62d288ddea16c60dcfd6
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          actual_sha="$(git rev-parse HEAD)"
          printf 'TARGET_SHA=%s\nACTUAL_SHA=%s\n' "$TARGET_SHA" "$actual_sha"
          test "$actual_sha" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked tool versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const expected = {
            typescript: '6.0.3',
            vitest: '4.1.10',
            'cross-spawn': '7.0.6',
            '@vitest/coverage-v8': '4.1.10',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = require(`./node_modules/${name}/package.json`).version;
            console.log(`${name}=${actual}`);
            if (actual !== version) process.exitCode = 1;
          }
          NODE

      - name: Run repaired T051 focused contracts
        run: npm test -- tests/check-artifact-io.contract.test.ts tests/vitest-task.contract.test.ts tests/vitest-fixture.integration.test.ts tests/vitest-check.integration.test.ts tests/lcov-normalization.test.ts tests/receipt-model.test.ts

      - name: Typecheck exact candidate
        run: npm run typecheck

      - name: Run full test suite
        run: npm test

      - name: Build exact candidate
        run: npm run build
