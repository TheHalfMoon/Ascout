name: T075 exact-head qualification

on:
  push:
    branches:
      - qualification/t075-exact-head-c61887d1

permissions:
  contents: read

env:
  MAIN_HEAD: eecdd3f5be693f4fa5d607790090836a3158014f
  BASE_FEATURE_HEAD: a0466508dce843cbbdf8f722e814ac15a2f71b9b
  CANDIDATE_HEAD: c61887d1af210c06deb7db6b26851851c2c1e345
  FEATURE_BRANCH: feat/075-isolated-benchmark-harness
  CANDIDATE_BRANCH: candidate/t075-final-harness-a0466508

jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_FEATURE_HEAD"
          git fetch origin main "$FEATURE_BRANCH" "$CANDIDATE_BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$BASE_FEATURE_HEAD"
          test "$(git rev-parse "origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_HEAD"
          test "$(git merge-base origin/main HEAD)" = "$MAIN_HEAD"
          test "$(git rev-list --left-right --count origin/main...HEAD)" = $'0\t26'
          expected=$'benchmarks/harness-lib.mjs\nbenchmarks/manifest.json\nbenchmarks/membership-preload.cjs\nbenchmarks/membership-proxy.mjs\nbenchmarks/run.mjs\ntests/benchmark-harness.test.ts\ntests/benchmark-membership-preload.test.ts\ntests/benchmark-membership-proof.test.ts'
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          test "$actual" = "$expected"
          git diff --check origin/main...HEAD
          test -z "$(git status --short)"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Full controller gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          node --check benchmarks/harness-lib.mjs
          node --check benchmarks/run.mjs
          node --check benchmarks/membership-proxy.mjs
          node --check benchmarks/membership-preload.cjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          if (manifest.manifest_revision !== 11) throw new Error(`expected manifest revision 11, got ${manifest.manifest_revision}`);
          if (manifest.cases.length !== 9) throw new Error(`expected 9 cases, got ${manifest.cases.length}`);
          const revisions = Object.fromEntries(manifest.cases.map((c) => [c.case_id, c.case_revision]));
          if (revisions['braintree-venmo-csp-nonce-web-login'] !== 3) throw new Error('Braintree revision 3 missing');
          if (revisions['tanstack-streamed-query-reducer'] !== 4) throw new Error('TanStack revision 4 missing');
          for (const c of manifest.cases) {
            if (c.lifecycle_state !== 'CASE_REVIEWED') throw new Error(`unexpected pre-run lifecycle for ${c.case_id}: ${c.lifecycle_state}`);
          }
          NODE
          test -z "$(git status --short)"

  replay:
    needs: controller
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        case_id:
          - zod-scientific-exponents
          - zod-jitless-allows-eval
          - tanstack-streamed-query-reducer
          - zustand-persist-latest-state
          - react-hook-form-value-as-date
          - trpc-streaming-onerror-cause
          - braintree-venmo-csp-nonce-web-login
          - immer-prototype-undefined
          - react-hook-form-valueasdate-minmax
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    name: replay / ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact candidate and read runtime
        id: runtime
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_FEATURE_HEAD"
          CASE_ID="$CASE_ID" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const c = manifest.cases.find((item) => item.case_id === process.env.CASE_ID);
          if (!c) throw new Error(`missing case ${process.env.CASE_ID}`);
          console.log(`node=${String(c.runtime.node_version).replace(/^v/, '')}`);
          console.log(`pm=${c.runtime.package_manager}`);
          console.log(`pm_version=${c.runtime.package_manager_version}`);
          console.log(`case_revision=${c.case_revision}`);
          console.log(`case_class=${c.case_class}`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build exact Ascout candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --check benchmarks/harness-lib.mjs
          node --check benchmarks/run.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Provision exact donor package manager
        shell: bash
        env:
          PM: ${{ steps.runtime.outputs.pm }}
          PM_VERSION: ${{ steps.runtime.outputs.pm_version }}
          NODE_VERSION: ${{ steps.runtime.outputs.node }}
        run: |
          set -euo pipefail
          if [ "$PM" = pnpm ]; then
            npm install --global "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = yarn ]; then
            npm install --global "yarn@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = npm ]; then
            test "$(npm --version)" = "$PM_VERSION"
          else
            echo "unsupported package manager $PM" >&2
            exit 2
          fi
          test "$(node --version)" = "v$NODE_VERSION"
          test "$($PM --version)" = "$PM_VERSION"
      - name: Replay exact reviewed case twice
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
          EXPECTED_REVISION: ${{ steps.runtime.outputs.case_revision }}
          CASE_CLASS: ${{ steps.runtime.outputs.case_class }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/${CASE_ID}.json"
          node benchmarks/run.mjs \
            --case "$CASE_ID" \
            --run-id "exact-head:${GITHUB_RUN_ID}:${CASE_ID}" \
            --repetitions 2 \
            --output "$result" \
            > "$RUNNER_TEMP/${CASE_ID}.stdout"
          RESULT="$result" CASE_ID="$CASE_ID" EXPECTED_REVISION="$EXPECTED_REVISION" CASE_CLASS="$CASE_CLASS" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (r.case_id !== process.env.CASE_ID) throw new Error('case identity mismatch');
          if (r.case_revision !== Number(process.env.EXPECTED_REVISION)) throw new Error('case revision mismatch');
          if (r.status !== 'BENCHMARK_ACTIVE' || r.lifecycle_state !== 'BENCHMARK_ACTIVE') throw new Error(`unexpected lifecycle ${r.status}/${r.lifecycle_state}`);
          if (r.valid_observation_count !== 2) throw new Error(`expected two valid observations, got ${r.valid_observation_count}`);
          if (r.evidence?.determinism !== 'deterministic' || r.evidence?.determinism_scope !== 'oracle_only') throw new Error('oracle determinism contract missing');
          if (!Array.isArray(r.evidence?.observations) || r.evidence.observations.length !== 2) throw new Error('two observation records required');
          const allowedStability = new Set(['stable', 'tree_drifted']);
          for (const o of r.evidence.observations) {
            if (o.pre_fix_oracle?.membership_proven !== true || o.fixed_oracle?.membership_proven !== true) throw new Error('oracle membership missing');
            if (o.ascout?.source_stability !== o.ascout?.independent_source_stability) throw new Error(`source stability mismatch: ${o.ascout?.source_stability}/${o.ascout?.independent_source_stability}`);
            if (!allowedStability.has(o.ascout?.source_stability)) throw new Error(`unexpected source stability ${o.ascout?.source_stability}`);
            if (process.env.CASE_CLASS === 'selection') {
              if (o.full_reference?.oracle_membership !== true) throw new Error('full-suite oracle membership missing');
              if (o.related?.oracle_membership !== true) throw new Error('related-selector oracle membership missing');
            } else {
              if (!o.gap_coverage?.artifact_sha256 || !Array.isArray(o.gap_coverage?.classifications)) throw new Error('gap coverage evidence missing');
            }
          }
          console.log(JSON.stringify({case_id:r.case_id,case_revision:r.case_revision,status:r.status,determinism:r.evidence.determinism,source_stability:r.evidence.observations.map((o)=>o.ascout.source_stability)}));
          NODE

  closing:
    needs: [controller, replay]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Closing exact-head guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git rev-parse HEAD^)" = "$BASE_FEATURE_HEAD"
          git fetch origin main "$FEATURE_BRANCH" "$CANDIDATE_BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$BASE_FEATURE_HEAD"
          test "$(git rev-parse "origin/$CANDIDATE_BRANCH")" = "$CANDIDATE_HEAD"
          test "$(git merge-base origin/main HEAD)" = "$MAIN_HEAD"
          test "$(git rev-list --left-right --count origin/main...HEAD)" = $'0\t26'
          test -z "$(git status --short)"
