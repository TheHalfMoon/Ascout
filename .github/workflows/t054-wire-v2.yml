name: Wire T054 bounded post-run widening v2

on:
  push:
    branches:
      - mutate/t054-wire-v2

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout live T054 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/054-post-run-widening
          fetch-depth: 0

      - name: Fetch mutation script from temporary branch
        shell: bash
        run: |
          git show origin/mutate/t054-wire-v2:scripts/t054-wire.py > /tmp/t054-wire.py

      - name: Patch T054 orchestration
        run: python /tmp/t054-wire.py

      - name: Check patch
        shell: bash
        run: |
          git diff --check
          git diff --stat

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Provision exact locked dependencies
        run: npm ci

      - name: Focused T054 tests
        run: |
          npm test -- \
            tests/post-run-widening.integration.test.ts \
            tests/post-run-widening-run-check.integration.test.ts \
            tests/vitest-task.contract.test.ts \
            tests/jest-task.contract.test.ts \
            tests/vitest-check.integration.test.ts \
            tests/jest-check.integration.test.ts \
            tests/check-receipt-end-to-end.contract.test.ts \
            tests/pre-run-widening.integration.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/check.ts
          git commit -m "feat(m1): execute one bounded post-run widening pass"
          git push origin HEAD:feat/054-post-run-widening
