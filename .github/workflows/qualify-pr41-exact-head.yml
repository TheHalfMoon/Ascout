name: Ephemeral PR41 exact-head qualification

on:
  push:
    branches:
      - qualify/pr41-8719ea1f

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout exact PR 41 candidate
        shell: bash
        env:
          TARGET_SHA: 8719ea1fa6e98cb4dad8446645ac944fa2b7e49a
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          actual_sha="$(git rev-parse HEAD)"
          printf 'TARGET_SHA=%s\nACTUAL_SHA=%s\n' "$TARGET_SHA" "$actual_sha"
          test "$actual_sha" = "$TARGET_SHA"
          test -z "$(git status --porcelain=v1)"
          node --version
          npm --version

      - name: Install locked dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked tool versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const expected = {
            typescript: '6.0.3',
            vitest: '4.1.10',
            'cross-spawn': '7.0.6',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = require(`./node_modules/${name}/package.json`).version;
            console.log(`${name}=${actual}`);
            if (actual !== version) process.exitCode = 1;
          }
          NODE

      - name: Run PR41 focused tests
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/check-admission.contract.test.ts \
            tests/cli.smoke.test.ts \
            tests/command-surface.contract.test.ts \
            tests/pr41-p0-regressions.contract.test.ts \
            tests/pytest-basic-task.contract.test.ts \
            tests/receipt-model.test.ts \
            tests/receipt-terminal.contract.test.ts \
            tests/receipt-timeline.contract.test.ts \
            tests/redaction.test.ts

      - name: Typecheck exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Run full test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
