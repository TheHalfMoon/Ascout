name: Ephemeral T051 TOCTOU repair

on:
  push:
    branches:
      - mutate/t051-toctou-fix

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mutation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Stage mutation inputs outside workspace
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/t051_toctou_fix.py /tmp/t051_toctou_fix.py
          cp .github/scripts/check-artifact-io.toctou.contract.test.ts /tmp/check-artifact-io.contract.test.ts

      - name: Checkout exact T051 feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/051-vitest-integration
          fetch-depth: 0

      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify expected T051 head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED=79788d4bf6568d1d1c68b2de53819e8dbe33f38c"
          echo "ACTUAL=$actual"
          test "$actual" = "79788d4bf6568d1d1c68b2de53819e8dbe33f38c"
          test -z "$(git status --porcelain=v1)"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply descriptor-bound TOCTOU repair
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/t051_toctou_fix.py
          cp /tmp/check-artifact-io.contract.test.ts tests/check-artifact-io.contract.test.ts
          git diff --check

      - name: Qualify repaired T051 tree
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/check-artifact-io.contract.test.ts tests/vitest-task.contract.test.ts tests/vitest-fixture.integration.test.ts tests/vitest-check.integration.test.ts tests/lcov-normalization.test.ts tests/receipt-model.test.ts
          npm test
          npm run build

      - name: Commit and push qualified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/check.ts tests/check-artifact-io.contract.test.ts
          git diff --cached --check
          git commit -m "fix(051): bind generated artifact I/O to descriptors"
          git push origin HEAD:feat/051-vitest-integration
