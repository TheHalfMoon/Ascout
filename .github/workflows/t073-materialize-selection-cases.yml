name: T073 materialize selection cases

on:
  push:
    branches:
      - qualification/t073-materialize-8d743268

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard canonical base and feature head
        shell: bash
        run: |
          set -euo pipefail
          expected='8d743268cc52664b19bac3c0d2c3ee115b1ba74d'
          git fetch origin main feat/073-benchmark-selection-cases
          test "$(git rev-parse origin/main)" = "$expected"
          test "$(git rev-parse origin/feat/073-benchmark-selection-cases)" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Materialize reviewed T073 cases
        shell: bash
        run: |
          set -euo pipefail
          git switch -C feat/073-benchmark-selection-cases origin/feat/073-benchmark-selection-cases
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('benchmarks/manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['manifest_revision'] == 1
          assert manifest['cases'] == []

          AUDIT = 'GitHub Actions metadata-only audit run 33147551173 / job 98771832673'

          def rev(commit_id, tree_id, parents):
              return {
                  'commit_id': commit_id,
                  'tree_id': tree_id,
                  'required_parent_ids': parents,
              }

          def license_review(blob, sha256, state):
              return {
                  'spdx_expression': 'MIT',
                  'evidence': [{
                      'path': 'LICENSE',
                      'blob_id': blob,
                      'sha256': sha256,
                  }],
                  'review_note': f'{state} exact-commit root LICENSE bytes identify the MIT License; {AUDIT} verified the evidence blob/digest and found no more-specific SPDX/license notice on the required production/regression paths.',
              }

          def make_case(*, case_id, repo_name, canonical_url, fix, fix_tree, base, base_tree, base_parents,
                        production, regression_tests, lock_blob, lock_sha256, license_blob, license_sha256,
                        package_manager_version, package_manager_provenance, node_version, node_provenance,
                        test_ids, historical_basis, provenance_urls, review_notes, extra_limitations=None):
              limitations = [
                  'T073 is definition-only: no donor dependency installation, donor script execution, donor test execution, or runtime PASS/FAIL claim has occurred; oracle observation remains null until T075.',
                  'The derived pre-fix tree identity is intentionally unobserved before T075 and must be materialized and pinned by the isolated harness before the case can advance beyond CASE_REVIEWED.',
              ]
              if extra_limitations:
                  limitations.extend(extra_limitations)
              return {
                  'case_id': case_id,
                  'case_revision': 1,
                  'case_class': 'selection',
                  'lifecycle_state': 'CASE_REVIEWED',
                  'upstream': {
                      'canonical_url': canonical_url,
                      'repository_name': repo_name,
                      'provenance_urls': provenance_urls,
                  },
                  'git': {
                      'base': rev(base, base_tree, base_parents),
                      'fix': rev(fix, fix_tree, [base]),
                      'oracle': rev(fix, fix_tree, [base]),
                      'relationship': {
                          'kind': 'direct_parent',
                          'required_parent_commit_id': base,
                          'rationale': 'The reviewed historical fix is a single-parent commit whose first and only parent is the pinned base; the oracle regression-test change is contained in the same pinned fix tree.',
                      },
                  },
                  'paths': {
                      'production': production,
                      'regression_tests': regression_tests,
                  },
                  'reconstruction': {
                      'mode': 'fix_tree_with_production_paths_reverted',
                      'steps': [
                          f'Materialize exact fix tree {fix_tree} from commit {fix}.',
                          f'Construct the derived pre-fix benchmark baseline by replacing only the listed production path blobs with their exact objects from base commit {base}; preserve the fix-tree regression-test and naturally present ancillary content unchanged.',
                          'Record the resulting derived Git tree identity during T075 and refuse replay if a repeated reconstruction produces a different tree.',
                          'Use the exact fix tree as the fixed measured state so the baseline-to-fixed diff contains production changes only; regression-test paths must be byte-identical across the measured comparison.',
                      ],
                      'measured_diff_contains_regression_test_change': False,
                      'derived_identity': {
                          'algorithm': 'git-tree',
                          'expected_digest': None,
                      },
                  },
                  'runtime': {
                      'package_manager': 'pnpm',
                      'package_manager_version': package_manager_version,
                      'package_manager_version_provenance': package_manager_provenance,
                      'lockfile': {
                          'path': 'pnpm-lock.yaml',
                          'blob_id': lock_blob,
                          'sha256': lock_sha256,
                      },
                      'node_version': node_version,
                      'node_constraint_provenance': node_provenance,
                      'immutable_harness_artifact': {
                          'required': False,
                          'sha256': None,
                          'reason': 'T073 is non-executing and does not choose a packaged T075 image. If T075 uses an immutable packaged harness/toolchain artifact, the case definition must be revised and pinned before donor execution.',
                      },
                  },
                  'licensing': {
                      'base': license_review(license_blob, license_sha256, 'Base'),
                      'fix': license_review(license_blob, license_sha256, 'Fix'),
                      'oracle': license_review(license_blob, license_sha256, 'Oracle'),
                      'file_level_review': {
                          'status': 'CLEAR',
                          'notes': f'{AUDIT} inspected required production/regression path blobs for SPDX/license notices and LFS pointers, confirmed no required submodules, and found no file-level term overriding the pinned MIT root license.',
                      },
                  },
                  'oracle': {
                      'specification': {
                          'regression_test_ids': test_ids,
                          'historical_basis': historical_basis,
                          'ground_truth_procedure': [
                              'At T075, materialize the reviewed derived pre-fix baseline and execute only the pinned project-native regression-test identity; require it to expose the historical pre-fix behavior rather than treating a setup/runner error as oracle evidence.',
                              'At T075, materialize the exact fixed state with the same regression-test bytes and execute the identical test identity; require the historical regression test to pass.',
                              'Run the project-native full/related test scope required by the case and prove the oracle test is contained and executed; repeat valid observations according to the benchmark determinism protocol.',
                              'Only after freezing independent oracle observations, compare plain project testing, project-native affected/related selection, and Ascout selection against the same production-only measured diff.',
                          ],
                          'independence_statement': 'Expected behavior is defined from pinned upstream fix history and upstream-authored regression tests, not from Ascout output, Ascout selection, Ascout LCOV normalization, or any benchmark-specific label injected into the donor tree.',
                      },
                      'observation': None,
                  },
                  'provenance': {
                      'issue_or_pr_urls': provenance_urls,
                      'review_notes': review_notes,
                  },
                  'limitations': limitations,
              }

