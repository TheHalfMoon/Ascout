              assert nodever.fullmatch(c['runtime']['node_version'])
              assert sha256.fullmatch(c['runtime']['lockfile']['sha256'])
              assert c['upstream']['canonical_url'].startswith('https://') and '@' not in c['upstream']['canonical_url']
              for r in (c['git']['base'], c['git']['fix'], c['git']['oracle']):
                  assert hex_id.fullmatch(r['commit_id']) and hex_id.fullmatch(r['tree_id'])
                  assert all(hex_id.fullmatch(p) for p in r['required_parent_ids'])
              for section in ('base', 'fix', 'oracle'):
                  lr = c['licensing'][section]
                  assert lr['spdx_expression'] == 'MIT'
                  assert lr['evidence'] and all(hex_id.fullmatch(e['blob_id']) and sha256.fullmatch(e['sha256']) for e in lr['evidence'])
              for p in c['paths']['production'] + c['paths']['regression_tests'] + [c['runtime']['lockfile']['path']]:
                  assert p and not bad_path.search(p), p
              assert c['oracle']['specification']['regression_test_ids']
              assert c['provenance']['issue_or_pr_urls']
              assert c['limitations']
              assert 'gap_changed_executable_lines' not in c['oracle']['specification']

          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'benchmarks/manifest.json'
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('benchmarks/manifest.json','utf8'));if(m.manifest_revision!==2||m.cases.length!==6)process.exit(1);console.log('T073 manifest materialization contract PASS')"

