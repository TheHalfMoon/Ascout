name: T075 full reviewed corpus qualification
on:
  push:
    branches:
      - qualification/t075-full-corpus-c0909d7d
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: zod-scientific-exponents
            node: 24.15.0
            pm: pnpm
            pm_version: 10.12.1
          - case_id: zod-jitless-allows-eval
            node: 24.15.0
            pm: pnpm
            pm_version: 10.12.1
          - case_id: tanstack-streamed-query-reducer
            node: 24.8.0
            pm: pnpm
            pm_version: 10.24.0
          - case_id: zustand-persist-latest-state
            node: 24.15.0
            pm: pnpm
            pm_version: 10.18.3
          - case_id: react-hook-form-value-as-date
            node: 22.22.2
            pm: pnpm
            pm_version: 11.7.0
          - case_id: trpc-streaming-onerror-cause
            node: 24.15.0
            pm: pnpm
            pm_version: 9.12.2
          - case_id: immer-prototype-undefined
            node: 24.0.0
            pm: yarn
            pm_version: 1.22.22
          - case_id: braintree-venmo-csp-nonce-web-login
            node: 20.19.0
            pm: npm
            pm_version: 10.8.2
          - case_id: react-hook-form-valueasdate-minmax
            node: 22.23.2
            pm: pnpm
            pm_version: 11.7.0
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: replay / ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0909d7d26c7258f5c9470c95a120d1ec117c67b
          fetch-depth: 0
          persist-credentials: false
      - name: Guard feature and main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c0909d7d26c7258f5c9470c95a120d1ec117c67b'
          git fetch https://github.com/TheHalfMoon/Ascout.git main
          test "$(git rev-parse FETCH_HEAD)" = 'eecdd3f5be693f4fa5d607790090836a3158014f'
          git fetch https://github.com/TheHalfMoon/Ascout.git feat/075-isolated-benchmark-harness
          test "$(git rev-parse FETCH_HEAD)" = 'c0909d7d26c7258f5c9470c95a120d1ec117c67b'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Build exact Ascout candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --check benchmarks/run.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Provision exact case package manager
        shell: bash
        env:
          PM: ${{ matrix.pm }}
          PM_VERSION: ${{ matrix.pm_version }}
        run: |
          set -euo pipefail
          if [ "$PM" = pnpm ]; then
            npm install --global "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = yarn ]; then
            npm install --global "yarn@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = npm ]; then
            test "$(npm --version)" = "$PM_VERSION"
          else
            echo "unsupported package manager $PM" >&2
            exit 2
          fi
          test "$(node --version)" = 'v${{ matrix.node }}'
          test "$($PM --version)" = "$PM_VERSION"
      - name: Replay reviewed case twice
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/${CASE_ID}.json"
          node benchmarks/run.mjs \
            --case "$CASE_ID" \
            --run-id "github:${GITHUB_RUN_ID}:${CASE_ID}" \
            --repetitions 2 \
            --output "$result" \
            > "$RUNNER_TEMP/${CASE_ID}.stdout.json"
          RESULT="$result" CASE_ID="$CASE_ID" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (result.case_id !== process.env.CASE_ID) throw new Error('case identity mismatch');
          if (result.status !== 'BENCHMARK_ACTIVE') throw new Error(`unexpected status ${result.status}`);
          if (result.valid_observation_count !== 2) throw new Error('expected two valid observations');
          if (result.evidence?.determinism !== 'deterministic') throw new Error('case is not deterministic');
          if (result.evidence?.network?.isolation_claimed !== false) throw new Error('network isolation claim must remain false');
          for (const observation of result.evidence.observations) {
            if (observation.pre_fix_oracle?.membership_proven !== true) throw new Error('pre-fix oracle membership missing');
            if (observation.fixed_oracle?.membership_proven !== true) throw new Error('fixed oracle membership missing');
            if (observation.ascout?.source?.repository_id_kind !== 'remote') throw new Error('Ascout source identity is not remote');
            if (observation.ascout?.source?.portable !== true) throw new Error('Ascout source identity is not portable');
          }
          console.log(JSON.stringify({
            case_id: result.case_id,
            status: result.status,
            derived_identity: result.derived_identity,
            synthetic_head: result.synthetic_head,
            evidence_sha256: result.evidence_sha256,
            determinism: result.evidence.determinism,
            ascout_exit_codes: result.evidence.observations.map((o) => o.ascout.exit_code),
          }));
          NODE
      - name: Closing source guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c0909d7d26c7258f5c9470c95a120d1ec117c67b'
          test -z "$(git status --porcelain)"
