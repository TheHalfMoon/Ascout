name: T064 runtime mutation

on:
  push:
    branches:
      - mutation/t064-wire-runtime

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/064-normalize-reproduction-flake
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply T064 patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/mutation/t064-wire-runtime:.github/scripts/t064_mutate.py > /tmp/t064_mutate.py
          test -s /tmp/t064_mutate.py
          python3 /tmp/t064_mutate.py
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Provision dependencies
        run: npm ci
      - name: Run focused T064 tests
        run: npm test -- tests/test-reproduction-normalization.contract.test.ts tests/flake-reproduction.contract.test.ts tests/flake-run-check.integration.test.ts tests/targeted-test-rerun.contract.test.ts
      - name: Typecheck patched feature
        run: npm run typecheck
      - name: Commit feature mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/check.ts src/receipt/model.ts tests/flake-reproduction.contract.test.ts
          test -n "$(git status --porcelain)"
          git commit -m "feat(m1): wire T064 reproduction and flake normalization"
          git push origin HEAD:feat/064-normalize-reproduction-flake
