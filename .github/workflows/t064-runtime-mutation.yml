name: T064 runtime mutation

on:
  push:
    branches:
      - mutation/t064-wire-runtime

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/064-normalize-reproduction-flake
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply T064 patch
        shell: bash
        run: |
          set -euo pipefail
          git show origin/mutation/t064-wire-runtime:.github/scripts/t064_mutate.py > /tmp/t064_mutate.py
          test -s /tmp/t064_mutate.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/t064_mutate.py')
          text = path.read_text()

          old_counts = '''check = check.replace(
              '    selectedTestCounts: [null],\\n  };',
              '    selectedTestCounts: [null],\\n    machineResults: [],\\n  };',
          )
          if check.count('machineResults: [],') < 4:
              raise SystemExit('expected evidence-error returns to gain machineResults')
          '''
          new_counts = '''evidence_error_needle = '    selectedTestCounts: [null],\\n  };'
          if check.count(evidence_error_needle) != 2:
              raise SystemExit(f"expected two evidence-error return blocks, found {check.count(evidence_error_needle)}")
          check = check.replace(
              evidence_error_needle,
              '    selectedTestCounts: [null],\\n    machineResults: [],\\n  };',
          )
          if check.count('    machineResults: [],\\n  };') != 2:
              raise SystemExit('expected exactly two evidence-error machineResults fields')
          '''
          if text.count(old_counts) != 1:
              raise SystemExit('machineResults count correction target not found exactly once')
          text = text.replace(old_counts, new_counts, 1)

          old_vitest = '''check = replace_once(
              check,
              '  let coveragePoints: readonly LcovLinePoint[] | null = null;\\n  let selectedTestCount: number | null = null;\\n  try {\\n    const machine = persistGeneratedTextArtifact(',
              '  let coveragePoints: readonly LcovLinePoint[] | null = null;\\n  let selectedTestCount: number | null = null;\\n  let machineResult: TestMachineResultRecord | null = null;\\n  try {\\n    const machine = persistGeneratedTextArtifact(',
              'Vitest machine result declaration',
          )
          '''
          new_vitest = '''vitest_machine_needle = '  let coveragePoints: readonly LcovLinePoint[] | null = null;\\n  let selectedTestCount: number | null = null;\\n  try {\\n    const machine = persistGeneratedTextArtifact('
          if check.count(vitest_machine_needle) != 2:
              raise SystemExit(f"expected shared Vitest/Jest declaration twice, found {check.count(vitest_machine_needle)}")
          check = check.replace(
              vitest_machine_needle,
              '  let coveragePoints: readonly LcovLinePoint[] | null = null;\\n  let selectedTestCount: number | null = null;\\n  let machineResult: TestMachineResultRecord | null = null;\\n  try {\\n    const machine = persistGeneratedTextArtifact(',
              1,
          )
          '''
          if text.count(old_vitest) != 1:
              raise SystemExit('Vitest declaration correction target not found exactly once')
          text = text.replace(old_vitest, new_vitest, 1)
          path.write_text(text)
          PY
          python3 /tmp/t064_mutate.py
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Provision dependencies
        run: npm ci
      - name: Run focused T064 tests
        run: npm test -- tests/test-reproduction-normalization.contract.test.ts tests/flake-reproduction.contract.test.ts tests/flake-run-check.integration.test.ts tests/targeted-test-rerun.contract.test.ts
      - name: Typecheck patched feature
        run: npm run typecheck
      - name: Commit feature mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/check.ts src/receipt/model.ts tests/flake-reproduction.contract.test.ts
          test -n "$(git status --porcelain)"
          git commit -m "feat(m1): wire T064 reproduction and flake normalization"
          git push origin HEAD:feat/064-normalize-reproduction-flake
