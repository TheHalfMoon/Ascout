name: One-shot strengthen T044 repeated-count vector

on:
  push:
    branches:
      - qualify/t044-dd9eebbe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reverse hit/zero observation order on exact T044 head
        shell: bash
        env:
          TARGET_SHA: dd9eebbe56f2a3b0b0d95159d31644d058193eef
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout -b t044-vector-fix FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          python3 - <<'PY'
          from pathlib import Path

          fixture = Path('tests/fixtures/lcov/cases.json')
          text = fixture.read_text()
          replacements = {
              '"id": "repeated-zero-and-hit"': '"id": "repeated-hit-then-zero"',
              '"purpose": "a repeated zero observation does not erase a positive observation for the same source line"': '"purpose": "a later repeated zero observation does not erase an earlier positive observation for the same source line"',
              'DA:11,0\\nend_of_record\\nTN:unit\\nSF:/repo/src/mixed.ts\\nDA:11,4': 'DA:11,4\\nend_of_record\\nTN:unit\\nSF:/repo/src/mixed.ts\\nDA:11,0',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'fixture replacement count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          fixture.write_text(text)

          test = Path('tests/lcov-fixtures.contract.test.ts')
          text = test.read_text()
          old = 'fixtureById(catalog, "repeated-zero-and-hit")'
          new = 'fixtureById(catalog, "repeated-hit-then-zero")'
          if text.count(old) != 1:
              raise SystemExit(f'test replacement count: {text.count(old)}')
          test.write_text(text.replace(old, new))
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = $'tests/fixtures/lcov/cases.json\ntests/lcov-fixtures.contract.test.ts'
          git diff -- tests/fixtures/lcov/cases.json tests/lcov-fixtures.contract.test.ts

          git config user.name "Ascout qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/fixtures/lcov/cases.json tests/lcov-fixtures.contract.test.ts
          git commit -m "test(044): prove later zero cannot erase hit"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/test/044-lcov-contract
