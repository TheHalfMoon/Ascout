name: Ephemeral T052 Windows fail-closed repair

on:
  push:
    branches:
      - mutate/t052-windows-failclosed

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout mutation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Stage patch outside workspace
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/t052_windows_failclosed.py /tmp/t052_windows_failclosed.py

      - name: Checkout exact repaired PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/052-jest-integration
          fetch-depth: 0

      - name: Select Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Verify expected PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "EXPECTED=d5afab51b691aaa73426a66884d1a7935046f97a"
          echo "ACTUAL=$actual"
          test "$actual" = "d5afab51b691aaa73426a66884d1a7935046f97a"
          test -z "$(git status --porcelain=v1)"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply Windows fail-closed repair
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/t052_windows_failclosed.py
          git diff --check

      - name: Typecheck candidate
        run: npm run typecheck

      - name: Run focused runner and evidence contracts
        run: npm test -- tests/jest-task.contract.test.ts tests/vitest-task.contract.test.ts tests/jest-check.integration.test.ts tests/vitest-check.integration.test.ts tests/check-artifact-io.contract.test.ts tests/lcov-normalization.test.ts tests/receipt-model.test.ts

      - name: Run full suite
        run: npm test

      - name: Build candidate
        run: npm run build

      - name: Commit and push qualified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/tools/jest.ts src/tools/vitest.ts tests/jest-task.contract.test.ts tests/vitest-task.contract.test.ts
          git diff --cached --check
          git commit -m "fix(052): fail closed on Windows POSIX shims"
          git push origin HEAD:feat/052-jest-integration
