name: T091 Audit Repair Applicator

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'style(002) normalize pnpm workspace detection block' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/091-m2-benchmark-replay

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Normalize exact discovery block
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/discovery.ts')
          text = path.read_text()
          start = text.index('  if (patterns === null && files["pnpm-workspace.yaml"] !== undefined) {')
          end = text.index('\n\n  if (patterns === null) {', start)
          current = text[start:end]
          if 'return /(?:^|[\\s{,])(?:packages|"packages"|\'packages\')\\s*:/u.test(cleaned);' not in current:
              raise SystemExit('unexpected discovery block; refusing formatting repair')
          new = '''  if (patterns === null && files["pnpm-workspace.yaml"] !== undefined) {
            const pnpmWorkspaceRaw = files["pnpm-workspace.yaml"];
            const declaresPackages = pnpmWorkspaceRaw.split(/\\r?\\n/u).some((line) => {
              if (line.trimStart().startsWith("#")) return false;
              const cleaned = line.replace(/\\s+#.*$/u, "").trimEnd();
              return /(?:^|[\\s{,])(?:packages|"packages"|'packages')\\s*:/u.test(cleaned);
            });
            if (declaresPackages) {
              patterns = pnpmWorkspacePatterns(pnpmWorkspaceRaw);
              sourcePaths = ["pnpm-workspace.yaml"];
              if (patterns === null) {
                return {
                  state: "unsupported",
                  kind: null,
                  patterns: [],
                  packageJsonPaths: root === undefined ? [] : ["package.json"],
                  sourcePaths,
                  reasonCode: "workspace_declaration_unsupported",
                  reasonText: "pnpm-workspace.yaml exceeds the supported basic packages-list grammar.",
                };
              }
            }
          }'''
          # Dedent from Python heredoc presentation to repository TypeScript style.
          lines = new.splitlines()
          normalized = [lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]]
          # Apply explicit TypeScript indentation relative to the outer block.
          normalized = [
            '  if (patterns === null && files["pnpm-workspace.yaml"] !== undefined) {',
            '    const pnpmWorkspaceRaw = files["pnpm-workspace.yaml"];',
            '    const declaresPackages = pnpmWorkspaceRaw.split(/\\r?\\n/u).some((line) => {',
            '      if (line.trimStart().startsWith("#")) return false;',
            '      const cleaned = line.replace(/\\s+#.*$/u, "").trimEnd();',
            '      return /(?:^|[\\s{,])(?:packages|"packages"|\'packages\')\\s*:/u.test(cleaned);',
            '    });',
            '    if (declaresPackages) {',
            '      patterns = pnpmWorkspacePatterns(pnpmWorkspaceRaw);',
            '      sourcePaths = ["pnpm-workspace.yaml"];',
            '      if (patterns === null) {',
            '        return {',
            '          state: "unsupported",',
            '          kind: null,',
            '          patterns: [],',
            '          packageJsonPaths: root === undefined ? [] : ["package.json"],',
            '          sourcePaths,',
            '          reasonCode: "workspace_declaration_unsupported",',
            '          reasonText: "pnpm-workspace.yaml exceeds the supported basic packages-list grammar.",',
            '        };',
            '      }',
            '    }',
            '  }',
          ]
          text = text[:start] + '\n'.join(normalized) + text[end:]
          path.write_text(text)
          PY

      - name: Qualify formatting repair
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          ./node_modules/.bin/vitest run tests/t091-pnpm-settings-only-workspace.contract.test.ts tests/t089-nested-runner-config.contract.test.ts tests/discovery-hardening.contract.test.ts
          npm run build
          git diff --check

      - name: Commit forward-only formatting repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --short src/discovery.ts)"
          git config user.name "TheHalfMoon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/discovery.ts
          git commit -m "style(002) normalize pnpm workspace detection block"
          git push origin HEAD:feat/091-m2-benchmark-replay
