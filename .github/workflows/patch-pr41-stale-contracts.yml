name: One-shot patch PR41 stale contract expectations

on:
  push:
    branches:
      - qualify/pr41-8719ea1f

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply two test-only contract corrections to exact PR41 head
        shell: bash
        env:
          TARGET_SHA: 8719ea1fa6e98cb4dad8446645ac944fa2b7e49a
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout -b pr41-contract-fix FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/check-receipt-end-to-end.contract.test.ts')
          text = path.read_text()
          old = '      expectSemanticRejection(receipt, "noncanonical_original_path");\n'
          new = (
              '      const error = captureContractError(() => renderReceiptJson(receipt));\n'
              '      expect(error.layer, invalid).toBe("schema");\n'
              '      expect(error.schemaIssues.length, invalid).toBeGreaterThan(0);\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one noncanonical-path assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          path = Path('tests/discovery-production.contract.test.ts')
          text = path.read_text()
          old = '      packageJsonPaths: ["package.json", "apps/web/package.json"],\n'
          new = '      packageJsonPaths: ["apps/web/package.json", "package.json"],\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one pnpm packageJsonPaths assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          printf 'CHANGED_PATHS=\n%s\n' "$changed"
          test "$changed" = $'tests/check-receipt-end-to-end.contract.test.ts\ntests/discovery-production.contract.test.ts'

          git config user.name "Ascout qualification bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/check-receipt-end-to-end.contract.test.ts tests/discovery-production.contract.test.ts
          git commit -m "test(m1): align stale contract expectations"

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:refs/heads/feat/043-init-canonical
