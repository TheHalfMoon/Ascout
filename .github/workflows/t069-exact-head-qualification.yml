name: T069 exact-head qualification

on:
  push:
    branches:
      - qualification/t069-exact-head-2c98615b

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact T069 feature head
        uses: actions/checkout@v4
        with:
          ref: 2c98615b87b2d31855934f22f67a69c5742bcaf7
          fetch-depth: 0

      - name: Opening exact-head and clean-tree guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2c98615b87b2d31855934f22f67a69c5742bcaf7"
          test -z "$(git status --short)"

      - name: Install locked dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused T066/T067/T069 tests
        shell: bash
        run: npx vitest run tests/agent-receipt.contract.test.ts tests/cross-format-consistency.contract.test.ts tests/agent-receipt.runtime.test.ts

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Build
        shell: bash
        run: npm run build

      - name: Full suite
        shell: bash
        run: npm test

      - name: Closing exact-head and clean-tree guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2c98615b87b2d31855934f22f67a69c5742bcaf7"
          test -z "$(git status --short)"
