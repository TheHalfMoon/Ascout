name: T075 Braintree revision 3 candidate
on:
  push:
    branches:
      - repair/t075-braintree-rev3-helper-cdf9a39e
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/t075-braintree-rev3-helper-cdf9a39e
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-braintree-rev3-cdf9a39e
          path: candidate
          fetch-depth: 0
      - name: Guard and patch exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = 'cdf9a39e93e1ce655184078cb469f08b9111d3c2'
          git fetch origin main feat/075-isolated-benchmark-harness candidate/t075-braintree-rev3-cdf9a39e
          test "$(git rev-parse origin/main)" = 'eecdd3f5be693f4fa5d607790090836a3158014f'
          test "$(git rev-parse origin/feat/075-isolated-benchmark-harness)" = 'cdf9a39e93e1ce655184078cb469f08b9111d3c2'
          test "$(git rev-parse origin/candidate/t075-braintree-rev3-cdf9a39e)" = 'cdf9a39e93e1ce655184078cb469f08b9111d3c2'
          cd ..
          node helper/.github/repair/t075_braintree_rev3.mjs candidate
          cd candidate
          git diff --check
          test "$(git status --short | awk '{print $2}')" = 'benchmarks/manifest.json'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Controller and manifest gates
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          node --check benchmarks/harness-lib.mjs
          node --check benchmarks/run.mjs
          node benchmarks/run.mjs --case braintree-venmo-csp-nonce-web-login --plan > "$RUNNER_TEMP/braintree-plan.json"
          PLAN="$RUNNER_TEMP/braintree-plan.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync(process.env.PLAN,'utf8'));
          if (p.case_revision !== 3) throw new Error('expected Braintree revision 3');
          if (!p.commands.fullCoverage.includes('--ignoreProjects publishing')) throw new Error('coverage command did not exclude publishing');
          if (!p.commands.nativeCoverage.includes('--ignoreProjects publishing')) throw new Error('native reference did not exclude publishing');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Replay Braintree revision 3 twice
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v20.19.0'
          test "$(npm --version)" = '10.8.2'
          result="$RUNNER_TEMP/braintree.json"
          node benchmarks/run.mjs \
            --case braintree-venmo-csp-nonce-web-login \
            --run-id "candidate:${GITHUB_RUN_ID}:braintree" \
            --repetitions 2 \
            --output "$result" \
            > "$RUNNER_TEMP/braintree.stdout"
          RESULT="$result" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RESULT,'utf8'));
          if (r.status !== 'BENCHMARK_ACTIVE' || r.case_revision !== 3) throw new Error('Braintree revision 3 did not become BENCHMARK_ACTIVE');
          if (r.valid_observation_count !== 2 || r.evidence?.determinism !== 'deterministic') throw new Error('Braintree revision 3 is not deterministic');
          for (const o of r.evidence.observations) {
            if (o.ascout?.source_stability !== 'stable') throw new Error('Ascout source stability missing');
            if (!o.gap_coverage?.artifact_sha256 || !Array.isArray(o.gap_coverage.classifications)) throw new Error('coverage evidence missing');
          }
          console.log(JSON.stringify({case_id:r.case_id,case_revision:r.case_revision,status:r.status,determinism:r.evidence.determinism,classifications:r.evidence.observations.map((o)=>o.gap_coverage.classifications)}));
          NODE
      - name: Commit candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git status --short | awk '{print $2}')" = 'benchmarks/manifest.json'
          git config user.name 'Ascout Benchmark Bot'
          git config user.email 'benchmark-bot@users.noreply.github.com'
          git add benchmarks/manifest.json
          git commit -m 'fix(benchmark): isolate Braintree publishing project'
          git fetch origin candidate/t075-braintree-rev3-cdf9a39e
          test "$(git rev-parse FETCH_HEAD)" = 'cdf9a39e93e1ce655184078cb469f08b9111d3c2'
          git push origin HEAD:refs/heads/candidate/t075-braintree-rev3-cdf9a39e
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
