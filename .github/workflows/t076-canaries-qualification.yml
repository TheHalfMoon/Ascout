name: T076 repaired canary qualification

on:
  push:
    branches:
      - qualification/t076-canaries-2d0d57d8

permissions:
  contents: read

jobs:
  selection-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d0d57d8d6fe30d6a7d84f31590948693043d259
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact product head and read runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2d0d57d8d6fe30d6a7d84f31590948693043d259"
          test "$(git rev-parse origin/main)" = "0037eaef0311c131a7596f3717b148c1f7f62038"
          CASE_ID=zustand-persist-latest-state node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'selection') throw new Error('selection canary case missing or misclassified');
          console.log(`node=${String(item.runtime.node_version).replace(/^v/, '')}`);
          console.log(`pm=${item.runtime.package_manager}`);
          console.log(`pm_version=${item.runtime.package_manager_version}`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Provision exact package manager and product
        shell: bash
        env:
          PM: ${{ steps.runtime.outputs.pm }}
          PM_VERSION: ${{ steps.runtime.outputs.pm_version }}
          NODE_VERSION: ${{ steps.runtime.outputs.node }}
        run: |
          set -euo pipefail
          if [ "$PM" = pnpm ]; then
            npm install --global "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = yarn ]; then
            npm install --global "yarn@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = npm ]; then
            test "$(npm --version)" = "$PM_VERSION"
          else
            echo "unsupported package manager $PM" >&2
            exit 2
          fi
          test "$(node --version)" = "v$NODE_VERSION"
          test "$($PM --version)" = "$PM_VERSION"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Execute selection metrics canary
        shell: bash
        run: |
          set -euo pipefail
          node benchmarks/metrics.mjs \
            --case zustand-persist-latest-state \
            --run-id selection-canary-${GITHUB_RUN_ID} \
            --repetitions 2 \
            --output "$RUNNER_TEMP/t076-selection.json" \
            > "$RUNNER_TEMP/t076-selection.stdout"
          RESULT="$RUNNER_TEMP/t076-selection.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (result.task !== 'T076' || result.status !== 'BENCHMARK_METRICS_READY') throw new Error('selection canary is not metrics-ready');
          if (result.case_id !== 'zustand-persist-latest-state') throw new Error('selection case identity mismatch');
          if (!Array.isArray(result.observations) || result.observations.length !== 2) throw new Error('selection raw observations missing');
          if (!Array.isArray(result.baselines) || result.baselines.length === 0 || result.baselines.some((item) => typeof item.baseline_id !== 'string' || item.baseline_id.length !== 64)) throw new Error('selection baseline binding invalid');
          for (const comparator of ['full', 'plain', 'related', 'ascout']) {
            const metric = result.metrics?.selection_recall?.[comparator];
            if (!metric || typeof metric.baseline_id !== 'string') throw new Error(`selection recall baseline missing for ${comparator}`);
          }
          if (!Array.isArray(result.metrics?.false_pass) || result.metrics.false_pass.length !== 4 || result.metrics.false_pass.some((item) => typeof item.baseline_id !== 'string')) throw new Error('selection false-PASS baselines missing');
          if (!Array.isArray(result.metrics?.timing) || result.metrics.timing.length < 8 || result.metrics.timing.some((item) => typeof item.baseline_id !== 'string')) throw new Error('selection timing baselines missing');
          if (!Array.isArray(result.metrics?.determinism) || result.metrics.determinism.length < 8 || result.metrics.determinism.some((item) => typeof item.baseline_id !== 'string')) throw new Error('selection determinism baselines missing');
          if (typeof result.metrics?.drift_detection?.baseline_id !== 'string') throw new Error('selection drift baseline missing');
          if (typeof result.metrics?.flake_classification_behavior?.baseline_id !== 'string') throw new Error('selection flake baseline missing');
          console.log(JSON.stringify({ case_id: result.case_id, selection_recall: result.metrics.selection_recall, false_pass: result.metrics.false_pass, drift_detection: result.metrics.drift_detection }));
          NODE

  gap-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d0d57d8d6fe30d6a7d84f31590948693043d259
          fetch-depth: 0
          persist-credentials: false
      - name: Guard exact product head and read runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2d0d57d8d6fe30d6a7d84f31590948693043d259"
          test "$(git rev-parse origin/main)" = "0037eaef0311c131a7596f3717b148c1f7f62038"
          CASE_ID=immer-prototype-undefined node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'gap') throw new Error('gap canary case missing or misclassified');
          console.log(`node=${String(item.runtime.node_version).replace(/^v/, '')}`);
          console.log(`pm=${item.runtime.package_manager}`);
          console.log(`pm_version=${item.runtime.package_manager_version}`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Provision exact package manager and product
        shell: bash
        env:
          PM: ${{ steps.runtime.outputs.pm }}
          PM_VERSION: ${{ steps.runtime.outputs.pm_version }}
          NODE_VERSION: ${{ steps.runtime.outputs.node }}
        run: |
          set -euo pipefail
          if [ "$PM" = pnpm ]; then
            npm install --global "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = yarn ]; then
            npm install --global "yarn@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = npm ]; then
            test "$(npm --version)" = "$PM_VERSION"
          else
            echo "unsupported package manager $PM" >&2
            exit 2
          fi
          test "$(node --version)" = "v$NODE_VERSION"
          test "$($PM --version)" = "$PM_VERSION"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Execute gap metrics canary
        shell: bash
        run: |
          set -euo pipefail
          node benchmarks/metrics.mjs \
            --case immer-prototype-undefined \
            --run-id gap-canary-${GITHUB_RUN_ID} \
            --repetitions 2 \
            --output "$RUNNER_TEMP/t076-gap.json" \
            > "$RUNNER_TEMP/t076-gap.stdout"
          RESULT="$RUNNER_TEMP/t076-gap.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (result.task !== 'T076' || result.status !== 'BENCHMARK_METRICS_READY') throw new Error('gap canary is not metrics-ready');
          if (result.case_id !== 'immer-prototype-undefined') throw new Error('gap case identity mismatch');
          if (!Array.isArray(result.observations) || result.observations.length !== 2) throw new Error('gap raw observations missing');
          if (!Array.isArray(result.baselines) || result.baselines.length === 0 || result.baselines.some((item) => typeof item.baseline_id !== 'string' || item.baseline_id.length !== 64)) throw new Error('gap baseline binding invalid');
          const gap = result.metrics?.gap_classification;
          if (!gap || typeof gap.accuracy_baseline_id !== 'string' || typeof gap.unresolved_baseline_id !== 'string') throw new Error('gap accuracy/unresolved baselines missing');
          if (!Array.isArray(result.metrics?.false_pass) || result.metrics.false_pass.length !== 1 || typeof result.metrics.false_pass[0].baseline_id !== 'string') throw new Error('gap false-PASS baseline missing');
          if (!Array.isArray(result.metrics?.timing) || result.metrics.timing.length < 6 || result.metrics.timing.some((item) => typeof item.baseline_id !== 'string')) throw new Error('gap timing baselines missing');
          if (!Array.isArray(result.metrics?.determinism) || result.metrics.determinism.length < 6 || result.metrics.determinism.some((item) => typeof item.baseline_id !== 'string')) throw new Error('gap determinism baselines missing');
          if (typeof result.metrics?.drift_detection?.baseline_id !== 'string') throw new Error('gap drift baseline missing');
          if (typeof result.metrics?.flake_classification_behavior?.baseline_id !== 'string') throw new Error('gap flake baseline missing');
          console.log(JSON.stringify({ case_id: result.case_id, gap_classification: result.metrics.gap_classification, false_pass: result.metrics.false_pass, drift_detection: result.metrics.drift_detection }));
          NODE
