name: T075 comparator isolation candidate
on:
  push:
    branches:
      - repair/t075-braintree-semantic-a0466508
permissions:
  contents: write

env:
  BASE_HEAD: a0466508dce843cbbdf8f722e814ac15a2f71b9b
  MAIN_HEAD: eecdd3f5be693f4fa5d607790090836a3158014f
  FEATURE_BRANCH: feat/075-isolated-benchmark-harness
  CANDIDATE_BRANCH: candidate/t075-final-harness-a0466508

jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/t075-braintree-semantic-a0466508
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-final-harness-a0466508
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Guard and patch candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          git fetch origin main "$FEATURE_BRANCH" "$CANDIDATE_BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$BASE_HEAD"
          test "$(git rev-parse "origin/$CANDIDATE_BRANCH")" = "$BASE_HEAD"
          cd ..
          python3 helper/.github/repair/t075_final_harness_patch.py candidate
          python3 helper/.github/repair/t075_braintree_semantic_patch.py candidate
          python3 helper/.github/repair/t075_comparator_isolation_patch.py candidate
          cd candidate
          git diff --check
          test "$(git status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "benchmarks/harness-lib.mjs benchmarks/manifest.json benchmarks/run.mjs tests/benchmark-harness.test.ts "
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Full controller gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          node --check benchmarks/harness-lib.mjs
          node --check benchmarks/run.mjs
          node --check benchmarks/membership-proxy.mjs
          node --check benchmarks/membership-preload.cjs
          node benchmarks/run.mjs --case tanstack-streamed-query-reducer --plan > "$RUNNER_TEMP/tanstack-plan.json"
          node benchmarks/run.mjs --case braintree-venmo-csp-nonce-web-login --plan > "$RUNNER_TEMP/braintree-plan.json"
          TANSTACK="$RUNNER_TEMP/tanstack-plan.json" BRAINTREE="$RUNNER_TEMP/braintree-plan.json" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const t = JSON.parse(fs.readFileSync(process.env.TANSTACK, 'utf8'));
          const b = JSON.parse(fs.readFileSync(process.env.BRAINTREE, 'utf8'));
          if (t.case_revision !== 3) throw new Error(`expected TanStack revision 3, got ${t.case_revision}`);
          if (b.case_revision !== 3) throw new Error(`expected Braintree revision 3, got ${b.case_revision}`);
          if (!b.commands.fullCoverage.includes('--ignoreProjects publishing')) throw new Error('Braintree coverage command is not publishing-isolated');
          if (!b.commands.nativeCoverage.includes('--ignoreProjects publishing')) throw new Error('Braintree native reference is not publishing-isolated');
          NODE

  braintree:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/t075-braintree-semantic-a0466508
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-final-harness-a0466508
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Guard and patch candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_HEAD"
          python3 helper/.github/repair/t075_final_harness_patch.py candidate
          python3 helper/.github/repair/t075_braintree_semantic_patch.py candidate
          python3 helper/.github/repair/t075_comparator_isolation_patch.py candidate
          git -C candidate diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build controller
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Replay Braintree revision 3 twice
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v20.19.0'
          test "$(npm --version)" = '10.8.2'
          result="$RUNNER_TEMP/braintree.json"
          node benchmarks/run.mjs \
            --case braintree-venmo-csp-nonce-web-login \
            --run-id "candidate:${GITHUB_RUN_ID}:braintree-isolated" \
            --repetitions 2 \
            --output "$result" \
            > "$RUNNER_TEMP/braintree.stdout"
          RESULT="$result" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (r.status !== 'BENCHMARK_ACTIVE' || r.case_revision !== 3) throw new Error('Braintree revision 3 is not BENCHMARK_ACTIVE');
          if (r.valid_observation_count !== 2 || r.evidence?.determinism !== 'deterministic') throw new Error('Braintree oracle observations are not deterministic');
          if (r.evidence?.determinism_scope !== 'oracle_only') throw new Error('Braintree determinism scope is not oracle_only');
          for (const o of r.evidence.observations) {
            if (o.ascout?.source_stability !== o.ascout?.independent_source_stability) throw new Error('Braintree source-stability attestation mismatch');
            if (!o.ascout?.source_state_start_sha256 || !o.ascout?.source_state_end_sha256) throw new Error('Braintree raw source-state evidence missing');
          }
          console.log(JSON.stringify({case_id:r.case_id,status:r.status,determinism:r.evidence.determinism,scope:r.evidence.determinism_scope,source_stability:r.evidence.observations.map((o)=>o.ascout.source_stability)}));
          NODE

  tanstack:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/t075-braintree-semantic-a0466508
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-final-harness-a0466508
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Guard and patch candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_HEAD"
          python3 helper/.github/repair/t075_final_harness_patch.py candidate
          python3 helper/.github/repair/t075_braintree_semantic_patch.py candidate
          python3 helper/.github/repair/t075_comparator_isolation_patch.py candidate
          git -C candidate diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build controller
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - name: Provision exact TanStack package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.24.0 --ignore-scripts --no-audit --no-fund
          test "$(node --version)" = 'v24.8.0'
          test "$(pnpm --version)" = '10.24.0'
      - name: Replay TanStack twice with isolated comparator state
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/tanstack.json"
          node benchmarks/run.mjs \
            --case tanstack-streamed-query-reducer \
            --run-id "candidate:${GITHUB_RUN_ID}:tanstack-isolated" \
            --repetitions 2 \
            --output "$result" \
            > "$RUNNER_TEMP/tanstack.stdout"
          RESULT="$result" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (r.status !== 'BENCHMARK_ACTIVE' || r.case_revision !== 3) throw new Error(`TanStack did not become BENCHMARK_ACTIVE: ${r.status}`);
          if (r.valid_observation_count !== 2 || r.evidence?.determinism !== 'deterministic') throw new Error('TanStack oracle observations are not deterministic');
          if (r.evidence?.determinism_scope !== 'oracle_only') throw new Error('TanStack determinism scope is not oracle_only');
          for (const o of r.evidence.observations) {
            if (o.full_reference?.oracle_membership !== true) throw new Error('TanStack full-suite oracle membership missing');
            if (!o.evidence?.full?.source_stability) throw new Error('TanStack full-suite source stability evidence missing');
          }
          console.log(JSON.stringify({case_id:r.case_id,status:r.status,determinism:r.evidence.determinism,scope:r.evidence.determinism_scope,full_source_stability:r.evidence.observations.map((o)=>o.evidence.full.source_stability)}));
          NODE

  commit:
    needs: [controller, braintree, tanstack]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/t075-braintree-semantic-a0466508
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-final-harness-a0466508
          path: candidate
          fetch-depth: 0
      - name: Reapply qualified patch and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$BASE_HEAD"
          git fetch origin main "$FEATURE_BRANCH" "$CANDIDATE_BRANCH"
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git rev-parse "origin/$FEATURE_BRANCH")" = "$BASE_HEAD"
          test "$(git rev-parse "origin/$CANDIDATE_BRANCH")" = "$BASE_HEAD"
          cd ..
          python3 helper/.github/repair/t075_final_harness_patch.py candidate
          python3 helper/.github/repair/t075_braintree_semantic_patch.py candidate
          python3 helper/.github/repair/t075_comparator_isolation_patch.py candidate
          cd candidate
          git diff --check
          git config user.name 'Ascout Benchmark Bot'
          git config user.email 'benchmark-bot@users.noreply.github.com'
          git add benchmarks/harness-lib.mjs benchmarks/run.mjs benchmarks/manifest.json tests/benchmark-harness.test.ts
          git commit -m 'fix(benchmark): isolate comparator source state'
          git push origin HEAD:refs/heads/candidate/t075-final-harness-a0466508
          echo "CANDIDATE_HEAD=$(git rev-parse HEAD)"
