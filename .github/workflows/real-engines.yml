name: Real Engines

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks / ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Guard exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const cp=require('node:child_process');const h=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(h!==process.env.EXPECTED_SHA)throw new Error('expected '+process.env.EXPECTED_SHA+', got '+h)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Acquire and verify Gitleaks
        run: node .github/scripts/acquire-gitleaks.mjs
      - name: Run Gitleaks through the broker
        env:
          ASCOUT_REQUIRE_REAL_GITLEAKS: "1"
          TMPDIR: ${{ runner.temp }}
        run: npx vitest run tests/assurance-gitleaks-real.test.ts
      - name: Archive version, help, and identity captures
        if: ${{ always() && env.ASCOUT_GITLEAKS_CAPTURES != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-captures-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ env.ASCOUT_GITLEAKS_CAPTURES }}
          if-no-files-found: error
          retention-days: 90
