      if (matchesRunner) {
        const instrumentation =
          kind === "vitest"
            ? ["--reporter=json", `--outputFile=${outputFile}`]
            : ["--json", `--outputFile=${outputFile}`];
        const argv = [...parsed.argv];
        argv.splice(runnerIndex + 1, 0, ...instrumentation);
        return { file: parsed.file, argv, env: parsed.env };
      }
    }
  }

