name: T075 Braintree drift diagnostic

on:
  push:
    branches:
      - diagnostic/t075-braintree-drift-c61887d1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c61887d1af210c06deb7db6b26851851c2c1e345
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Add runner-local status instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('benchmarks/run.mjs')
          s = p.read_text()
          old = '''  const sourceStateStartSha256 = await independentSourceStateDigest(repo, env);\n  const result = await runBounded({ file: process.execPath, argv: [cli, "check", "--format", "json"], cwd: repo, env, timeoutMs: DEFAULT_TIMEOUT_MS });'''
          new = '''  const sourceStatusStart = await runGit(repo, ["status", "--porcelain=v1", "-z", "--untracked-files=all"], env);\n  const sourceStateStartSha256 = await independentSourceStateDigest(repo, env);\n  const result = await runBounded({ file: process.execPath, argv: [cli, "check", "--format", "json"], cwd: repo, env, timeoutMs: DEFAULT_TIMEOUT_MS });'''
          if old not in s:
              raise SystemExit('start instrumentation anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const sourceStateEndSha256 = await independentSourceStateDigest(repo, env);\n  const reportedSourceStability = receipt?.stability ?? receipt?.source?.stability ?? receipt?.source_stability ?? null;'''
          new = '''  const sourceStatusEnd = await runGit(repo, ["status", "--porcelain=v1", "-z", "--untracked-files=all"], env);\n  const sourceStateEndSha256 = await independentSourceStateDigest(repo, env);\n  const reportedSourceStability = receipt?.stability ?? receipt?.source?.stability ?? receipt?.source_stability ?? null;'''
          if old not in s:
              raise SystemExit('end instrumentation anchor missing')
          s = s.replace(old, new, 1)
          old = '''    source_state_end_sha256: sourceStateEndSha256,\n    source: {'''
          new = '''    source_state_end_sha256: sourceStateEndSha256,\n    diagnostic_source_status_start_b64: sourceStatusStart.stdout.toString("base64"),\n    diagnostic_source_status_end_b64: sourceStatusEnd.stdout.toString("base64"),\n    source: {'''
          if old not in s:
              raise SystemExit('return instrumentation anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check benchmarks/run.mjs
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Verify exact donor npm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v20.19.0"
          test "$(npm --version)" = "10.8.2"
      - name: Replay and print status delta
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/braintree.json"
          node benchmarks/run.mjs \
            --case braintree-venmo-csp-nonce-web-login \
            --run-id "diagnostic:${GITHUB_RUN_ID}:braintree-drift" \
            --repetitions 2 \
            --output "$out" \
            > "$RUNNER_TEMP/braintree.stdout"
          RESULT="$out" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          for (const [index, o] of r.evidence.observations.entries()) {
            const decode = (v) => Buffer.from(v, 'base64').toString('utf8').split('\0').filter(Boolean).sort();
            const before = decode(o.ascout.diagnostic_source_status_start_b64);
            const after = decode(o.ascout.diagnostic_source_status_end_b64);
            console.log(JSON.stringify({observation:index+1,reported:o.ascout.source_stability,independent:o.ascout.independent_source_stability,before,after,added:after.filter((x)=>!before.includes(x)),removed:before.filter((x)=>!after.includes(x))}));
          }
          NODE
