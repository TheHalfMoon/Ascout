name: T003 lockfile evidence

on:
  push:
    branches:
      - evidence/t003-lockgen-2026-08-22
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use Node 22.0.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Upgrade npm resolver
        run: npm install --global npm@10.9.4 --ignore-scripts --audit=false --fund=false

      - name: Record toolchain
        run: |
          node --version
          npm --version

      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --audit=false --fund=false

      - name: Verify exact direct dependency resolutions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = {
            'cross-spawn': '7.0.6',
            '@types/node': '22.20.1',
            'typescript': '6.0.3',
            'vite': '6.4.3',
            'vitest': '4.1.10',
          };
          for (const [name, version] of Object.entries(expected)) {
            const entry = lock.packages?.[`node_modules/${name}`];
            if (!entry || entry.version !== version || !entry.integrity) {
              throw new Error(`lock mismatch for ${name}: ${JSON.stringify(entry)}`);
            }
          }
          const root = lock.packages?.[''];
          if (root?.dependencies?.['cross-spawn'] !== '7.0.6') throw new Error('root cross-spawn spec mismatch');
          for (const name of ['@types/node', 'typescript', 'vite', 'vitest']) {
            if (root?.devDependencies?.[name] !== expected[name]) throw new Error(`root dev spec mismatch for ${name}`);
          }
          console.log('LOCK_DIRECT_RESOLUTION=PASS');
          NODE

      - name: Install exact graph without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false

      - name: Verify toolchain executes on Node 22.0.0
        run: |
          ./node_modules/.bin/tsc --version
          ./node_modules/.bin/vite --version
          ./node_modules/.bin/vitest --version
          npm ls --all

      - name: Audit resolved graph
        run: npm audit --package-lock-only --audit-level=high

      - name: Commit generated lockfile to evidence branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(t003-lockgen): generate package lock"
          git push origin HEAD
