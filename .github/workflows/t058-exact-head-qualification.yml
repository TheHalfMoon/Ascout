name: T058 exact-head qualification

on:
  push:
    branches:
      - qualification/t058-exact-head-801e9e8b

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact T058 head
        uses: actions/checkout@v4
        with:
          ref: 801e9e8bc3789f7ce71d4fd8112818d3a219e10e
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove opening exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "801e9e8bc3789f7ce71d4fd8112818d3a219e10e"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git status --short

      - name: Provision exact locked dependencies
        run: npm ci

      - name: Run focused T058 qualification
        run: |
          npm test -- \
            tests/drift.contract.test.ts \
            tests/git-tree-digest.test.ts \
            tests/receipt-model.test.ts \
            tests/exercise-exit.contract.test.ts \
            tests/receipt-v1.semantic-invariants.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Prove closing exact head and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "801e9e8bc3789f7ce71d4fd8112818d3a219e10e"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git status --short --untracked-files=no
