name: T062 exact-head qualification

on:
  push:
    branches:
      - qualification/t062-exact-head-504a23ca

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact T062 head
        uses: actions/checkout@v4
        with:
          ref: 504a23caf3e173a7509113b15ff147d9958312ab
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prove opening exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "504a23caf3e173a7509113b15ff147d9958312ab"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git status --short
      - name: Provision exact locked dependencies
        run: npm ci
      - name: Run focused T062 qualification
        run: >-
          npm test --
          tests/source-stability-run-check.integration.test.ts
          tests/drift.contract.test.ts
          tests/exit-precedence.contract.test.ts
          tests/receipt-v1.semantic-invariants.test.ts
          tests/receipt-model.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run full test suite
        run: npm test
      - name: Prove closing exact head and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "504a23caf3e173a7509113b15ff147d9958312ab"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git status --short --untracked-files=no
