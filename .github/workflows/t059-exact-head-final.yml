name: T059 final exact-head qualification

on:
  push:
    branches:
      - qualification/t059-exact-head-d3e61ad7

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact T059 head
        uses: actions/checkout@v4
        with:
          ref: d3e61ad74fab2b1faa92525280a227be4922bd66
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove opening exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d3e61ad74fab2b1faa92525280a227be4922bd66"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git status --short

      - name: Provision exact locked dependencies
        run: npm ci

      - name: Run focused T059 qualification
        run: >-
          npm test --
          tests/flake-reproduction.contract.test.ts
          tests/receipt-model.test.ts
          tests/task-status.contract.test.ts
          tests/receipt-v1.semantic-invariants.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Prove closing exact head and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d3e61ad74fab2b1faa92525280a227be4922bd66"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git status --short --untracked-files=no
