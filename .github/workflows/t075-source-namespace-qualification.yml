name: T075 source namespace qualification
on:
  push:
    branches:
      - qualification/t075-source-namespace-277668ef
permissions:
  contents: read

env:
  BASE_HEAD: a0466508dce843cbbdf8f722e814ac15a2f71b9b
  MAIN_HEAD: eecdd3f5be693f4fa5d607790090836a3158014f
  FEATURE_BRANCH: feat/075-isolated-benchmark-harness
  CANDIDATE_BRANCH: candidate/t075-final-harness-a0466508

jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualification/t075-source-namespace-277668ef
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-final-harness-a0466508
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Guard and apply candidate patch stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_HEAD"
          git -C candidate fetch origin main "$FEATURE_BRANCH" "$CANDIDATE_BRANCH"
          test "$(git -C candidate rev-parse origin/main)" = "$MAIN_HEAD"
          test "$(git -C candidate rev-parse "origin/$FEATURE_BRANCH")" = "$BASE_HEAD"
          test "$(git -C candidate rev-parse "origin/$CANDIDATE_BRANCH")" = "$BASE_HEAD"
          python3 helper/.github/repair/t075_final_harness_patch.py candidate
          python3 helper/.github/repair/t075_braintree_semantic_patch.py candidate
          python3 helper/.github/repair/t075_comparator_isolation_patch.py candidate
          python3 helper/.github/repair/t075_source_namespace_patch.py candidate
          git -C candidate diff --check
          test "$(git -C candidate status --short | awk '{print $2}' | sort | tr '\n' ' ')" = "benchmarks/harness-lib.mjs benchmarks/manifest.json benchmarks/run.mjs tests/benchmark-harness.test.ts "
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Full controller gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          node --check benchmarks/harness-lib.mjs
          node --check benchmarks/run.mjs
          node --check benchmarks/membership-proxy.mjs
          node --check benchmarks/membership-preload.cjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          if (m.manifest_revision !== 10) throw new Error(`expected manifest revision 10, got ${m.manifest_revision}`);
          if (m.cases.length !== 9) throw new Error(`expected 9 cases, got ${m.cases.length}`);
          const b = m.cases.find((c) => c.case_id === 'braintree-venmo-csp-nonce-web-login');
          if (b?.case_revision !== 3) throw new Error('Braintree revision 3 missing');
          NODE

  replay:
    needs: controller
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case_id:
          - zod-scientific-exponents
          - zustand-persist-latest-state
          - react-hook-form-value-as-date
          - trpc-streaming-onerror-cause
          - braintree-venmo-csp-nonce-web-login
          - immer-prototype-undefined
          - zod-jitless-allows-eval
          - react-hook-form-valueasdate-minmax
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    name: replay / ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualification/t075-source-namespace-277668ef
          path: helper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: candidate/t075-final-harness-a0466508
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Guard and apply candidate patch stack
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_HEAD"
          python3 helper/.github/repair/t075_final_harness_patch.py candidate
          python3 helper/.github/repair/t075_braintree_semantic_patch.py candidate
          python3 helper/.github/repair/t075_comparator_isolation_patch.py candidate
          python3 helper/.github/repair/t075_source_namespace_patch.py candidate
          git -C candidate diff --check
      - name: Read exact donor runtime
        id: runtime
        working-directory: candidate
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          CASE_ID="$CASE_ID" node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const m = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const c = m.cases.find((item) => item.case_id === process.env.CASE_ID);
          if (!c) throw new Error(`missing case ${process.env.CASE_ID}`);
          console.log(`node=${String(c.runtime.node_version).replace(/^v/, '')}`);
          console.log(`pm=${c.runtime.package_manager}`);
          console.log(`pm_version=${c.runtime.package_manager_version}`);
          console.log(`case_revision=${c.case_revision}`);
          console.log(`case_class=${c.case_class}`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build exact Ascout candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --check benchmarks/harness-lib.mjs
          node --check benchmarks/run.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Provision exact donor package manager
        shell: bash
        env:
          PM: ${{ steps.runtime.outputs.pm }}
          PM_VERSION: ${{ steps.runtime.outputs.pm_version }}
          NODE_VERSION: ${{ steps.runtime.outputs.node }}
        run: |
          set -euo pipefail
          if [ "$PM" = pnpm ]; then
            npm install --global "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = yarn ]; then
            npm install --global "yarn@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          elif [ "$PM" = npm ]; then
            test "$(npm --version)" = "$PM_VERSION"
          else
            echo "unsupported package manager $PM" >&2
            exit 2
          fi
          test "$(node --version)" = "v$NODE_VERSION"
          test "$($PM --version)" = "$PM_VERSION"
      - name: Replay reviewed case twice
        working-directory: candidate
        shell: bash
        env:
          CASE_ID: ${{ matrix.case_id }}
          EXPECTED_REVISION: ${{ steps.runtime.outputs.case_revision }}
          CASE_CLASS: ${{ steps.runtime.outputs.case_class }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/${CASE_ID}.json"
          node benchmarks/run.mjs \
            --case "$CASE_ID" \
            --run-id "source-namespace:${GITHUB_RUN_ID}:${CASE_ID}" \
            --repetitions 2 \
            --output "$result" \
            > "$RUNNER_TEMP/${CASE_ID}.stdout"
          RESULT="$result" CASE_ID="$CASE_ID" EXPECTED_REVISION="$EXPECTED_REVISION" CASE_CLASS="$CASE_CLASS" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync(process.env.RESULT, 'utf8'));
          if (r.case_id !== process.env.CASE_ID) throw new Error('case identity mismatch');
          if (r.case_revision !== Number(process.env.EXPECTED_REVISION)) throw new Error('case revision mismatch');
          if (r.status !== 'BENCHMARK_ACTIVE' || r.lifecycle_state !== 'BENCHMARK_ACTIVE') throw new Error(`unexpected lifecycle ${r.status}/${r.lifecycle_state}`);
          if (r.valid_observation_count !== 2) throw new Error('expected two valid observations');
          if (r.evidence?.determinism !== 'deterministic' || r.evidence?.determinism_scope !== 'oracle_only') throw new Error('oracle determinism contract missing');
          for (const o of r.evidence.observations) {
            if (o.pre_fix_oracle?.membership_proven !== true || o.fixed_oracle?.membership_proven !== true) throw new Error('oracle membership missing');
            if (o.ascout?.source_stability !== o.ascout?.independent_source_stability) throw new Error(`source stability mismatch: ${o.ascout?.source_stability}/${o.ascout?.independent_source_stability}`);
            if (process.env.CASE_CLASS === 'selection') {
              if (o.full_reference?.oracle_membership !== true || o.related?.oracle_membership !== true) throw new Error('selection comparator membership missing');
            } else if (!o.gap_coverage?.artifact_sha256 || !Array.isArray(o.gap_coverage?.classifications)) {
              throw new Error('gap coverage evidence missing');
            }
          }
          console.log(JSON.stringify({case_id:r.case_id,status:r.status,revision:r.case_revision,determinism:r.evidence.determinism,scope:r.evidence.determinism_scope,source_stability:r.evidence.observations.map((o)=>o.ascout.source_stability)}));
          NODE
