name: T064 review repair

on:
  push:
    branches:
      - mutation/t064-review-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact reviewed feature head
        uses: actions/checkout@v4
        with:
          ref: feat/064-normalize-reproduction-flake
          fetch-depth: 0
      - name: Guard reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "563ef13645073592995a58421333343f26073d44"
          test -z "$(git status --porcelain)"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Qodo review repairs
        shell: bash
        run: |
          set -euo pipefail
          git show origin/mutation/t064-review-repair:.github/scripts/t064_review_repair.py > /tmp/t064_review_repair.py
          test -s /tmp/t064_review_repair.py
          python3 /tmp/t064_review_repair.py
          git diff --check
          test -n "$(git status --porcelain)"
      - name: Provision dependencies
        run: npm ci
      - name: Run focused repair tests
        run: npm test -- tests/flake-run-check.integration.test.ts tests/test-reproduction-normalization.contract.test.ts tests/flake-reproduction.contract.test.ts tests/targeted-test-rerun.contract.test.ts tests/jest-check.integration.test.ts tests/vitest-check.integration.test.ts tests/receipt-model.test.ts
      - name: Typecheck repair
        run: npm run typecheck
      - name: Commit and push repaired feature head
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/check.ts tests/flake-run-check.integration.test.ts
          git commit -m "fix(m1): harden T064 rerun evidence"
          git push origin HEAD:feat/064-normalize-reproduction-flake
