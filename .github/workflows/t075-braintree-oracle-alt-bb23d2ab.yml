name: T075 Braintree coverage alternatives bb23d2ab
on:
  push:
    branches:
      - diagnostic/t075-braintree-oracle-alt-bb23d2ab
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: braintree/braintree-web
          ref: ba7327135aa757aab5534d41d5871723bd06103a
          path: donor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Install exact donor dependencies
        working-directory: donor
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v20.19.0'
          test "$(npm --version)" = '10.8.2'
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe full coverage without lifecycle prebuild
        working-directory: donor
        run: |
          set -euo pipefail
          rm -rf src/coverage
          set +e
          BRAINTREE_JS_ENV=development npm_config_ignore_scripts=true ./node_modules/.bin/jest --config=jest.config.json --runInBand --coverage --coverageReporters=lcov --coverageDirectory=coverage >"$RUNNER_TEMP/root.out" 2>"$RUNNER_TEMP/root.err"
          code=$?
          set -e
          echo "ROOT_EXIT=$code"
          mapfile -t artifacts < <(find . -type f -name lcov.info -print | sort)
          echo "LCOV_COUNT=${#artifacts[@]}"
          for artifact in "${artifacts[@]}"; do
            echo "LCOV=$artifact"
            sha256sum "$artifact"
            echo "VENMO_SOURCES_BEGIN"
            grep '^SF:' "$artifact" | grep -E '(^|/)venmo(/|\.js)' | head -n 20 || true
            echo "VENMO_SOURCES_END"
            awk 'BEGIN{inside=0} /^SF:/{inside=($0 ~ /(^|\/)venmo\/venmo\.js$/)} inside && /^DA:87,/{print "LINE87=" $0}' "$artifact"
          done
          echo 'ERR_TAIL_BEGIN'
          tail -n 40 "$RUNNER_TEMP/root.err" || true
          echo 'ERR_TAIL_END'
