name: T055 exact-head qualification

on:
  push:
    branches:
      - qualification/t055-exact-head-4270bfa6

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact T055 head
        uses: actions/checkout@v4
        with:
          ref: 4270bfa6319a2fb0a36d9c7626e588fd43ca3fe2
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove opening exact head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4270bfa6319a2fb0a36d9c7626e588fd43ca3fe2"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          git status --short

      - name: Provision exact locked dependencies
        run: npm ci

      - name: Run focused T055 qualification
        run: |
          npm test -- \
            tests/changed-line-exercise.integration.test.ts \
            tests/changed-line-exercise-run-check.integration.test.ts \
            tests/exercise-state.contract.test.ts \
            tests/exercise-exit.contract.test.ts \
            tests/post-run-widening.integration.test.ts \
            tests/post-run-widening-run-check.integration.test.ts \
            tests/post-run-widening-jest-run-check.integration.test.ts \
            tests/vitest-check.integration.test.ts \
            tests/jest-check.integration.test.ts \
            tests/check-receipt-end-to-end.contract.test.ts \
            tests/receipt-v1.semantic-invariants.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run full test suite
        run: npm test

      - name: Prove closing exact head and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4270bfa6319a2fb0a36d9c7626e588fd43ca3fe2"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD
          git status --short --untracked-files=no
