name: Project CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project:
    name: project / ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # Windows runs one test worker and already takes 18-28 minutes on shared runners; 30 cancelled
    # passing runs at the limit (2026-11-13: main, #755, #756). The limit only bounds a hang.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Guard exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const cp=require('node:child_process');const h=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(h!==process.env.EXPECTED_SHA)throw new Error('expected '+process.env.EXPECTED_SHA+', got '+h)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provision exact Chromium runtime
        run: >-
          node -e "const {spawnSync}=require('node:child_process');const {dirname,join}=require('node:path');const pkgPath=require.resolve('playwright/package.json');const pkg=require(pkgPath);if(pkg.version!=='1.63.0')throw new Error('expected playwright@1.63.0, got '+String(pkg.version));const cli=join(dirname(pkgPath),'cli.js');const args=process.platform==='linux'?['install','--with-deps','chromium']:['install','chromium'];const result=spawnSync(process.execPath,[cli,...args],{stdio:'inherit'});if(result.error)throw result.error;if(result.status!==0)process.exit(result.status??1)"
      - name: Allow Chromium's sandbox on Ubuntu
        if: runner.os == 'Linux'
        # Ubuntu 23.10+ AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs;
        # the browser adapter launches with the sandbox on and does not fall back to --no-sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install bubblewrap for the Linux filesystem sandbox research (FD-4 T1-FS)
        if: runner.os == 'Linux'
        # The sandbox uses unprivileged user namespaces, which the AppArmor step above allows.
        # It looks for bwrap only at these fixed paths, never on PATH.
        run: |
          if ! test -x /usr/bin/bwrap && ! test -x /bin/bwrap; then
            sudo apt-get update -q
            sudo apt-get install -y -q bubblewrap
          fi
          bwrap --version
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        if: ${{ runner.os != 'Windows' }}
        env:
          TMPDIR: ${{ runner.temp }}
          # On Linux the sandbox must start, so its native evidence can't silently skip.
          ASCOUT_REQUIRE_LINUX_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm test
      - name: Test (Windows bounded workers)
        if: ${{ runner.os == 'Windows' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test -- --maxWorkers=1
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
