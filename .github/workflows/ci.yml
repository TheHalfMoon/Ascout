name: Project CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project:
    name: project / ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Guard exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const cp=require('node:child_process');const h=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();if(h!==process.env.EXPECTED_SHA)throw new Error('expected '+process.env.EXPECTED_SHA+', got '+h)"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provision exact Chromium runtime
        run: >-
          node -e "const {spawnSync}=require('node:child_process');const {dirname,join}=require('node:path');const pkgPath=require.resolve('playwright/package.json');const pkg=require(pkgPath);if(pkg.version!=='1.63.0')throw new Error('expected playwright@1.63.0, got '+String(pkg.version));const cli=join(dirname(pkgPath),'cli.js');const args=process.platform==='linux'?['install','--with-deps','chromium']:['install','chromium'];const result=spawnSync(process.execPath,[cli,...args],{stdio:'inherit'});if(result.error)throw result.error;if(result.status!==0)process.exit(result.status??1)"
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        if: ${{ runner.os != 'Windows' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test
      - name: Test (Windows bounded workers)
        if: ${{ runner.os == 'Windows' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: npm test -- --maxWorkers=1
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
