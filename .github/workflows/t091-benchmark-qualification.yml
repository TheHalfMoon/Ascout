name: T091 Discovery Repair Applicator

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/discovery.ts')
          text = path.read_text(encoding='utf-8')
          start_marker = '  if (patterns === null && files["pnpm-workspace.yaml"] !== undefined) {\n'
          end_marker = '\n  if (patterns === null) {\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f'expected one pnpm workspace block start, found {text.count(start_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''  if (patterns === null && files["pnpm-workspace.yaml"] !== undefined) {
            const pnpmWorkspaceRaw = files["pnpm-workspace.yaml"];
            const declaresPackages = pnpmWorkspaceRaw.split(/\\r?\\n/u).some((line) => {
              if (line.trimStart().startsWith("#")) return false;
              const cleaned = line.replace(/\\s+#.*$/u, "").trimEnd();
              return /^packages\\s*:/u.test(cleaned);
            });
            if (declaresPackages) {
              patterns = pnpmWorkspacePatterns(pnpmWorkspaceRaw);
              sourcePaths = ["pnpm-workspace.yaml"];
              if (patterns === null) {
                return {
                  state: "unsupported",
                  kind: null,
                  patterns: [],
                  packageJsonPaths: root === undefined ? [] : ["package.json"],
                  sourcePaths,
                  reasonCode: "workspace_declaration_unsupported",
                  reasonText: "pnpm-workspace.yaml exceeds the supported basic packages-list grammar.",
                };
              }
            }
          }
          '''
          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/discovery.ts

      - name: Qualify focused repair
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          ./node_modules/.bin/vitest run \
            tests/t091-pnpm-settings-only-workspace.contract.test.ts \
            tests/t089-nested-runner-config.contract.test.ts \
            tests/discovery-hardening.contract.test.ts
          test -n "$(git diff -- src/discovery.ts)"
          test "$(git status --short | grep -c '^ M src/discovery.ts$')" -eq 1

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Abdulaziz M. Shehri"
          git config user.email "alshehriofficial@gmail.com"
          git add src/discovery.ts
          git commit -m "fix(002): preserve settings-only pnpm single-package fidelity"
          git push origin HEAD:feat/091-m2-benchmark-replay
