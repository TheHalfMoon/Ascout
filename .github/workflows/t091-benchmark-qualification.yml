name: T091 React Hook Form Diagnostic

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: read

jobs:
  diagnose-react-hook-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CASE_ID: react-hook-form-value-as-date
      ASCOUT_CONTROLLER_NODE: 24.15.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up controller Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm

      - name: Install and build Ascout
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Read frozen donor runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'selection') throw new Error('focused selection case is unavailable');
          if (item.runtime.package_manager !== 'pnpm') throw new Error(`unexpected package manager: ${item.runtime.package_manager}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${item.runtime.node_version}\npm_version=${item.runtime.package_manager_version}\n`);
          NODE

      - name: Set up frozen donor Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install frozen donor package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --force "pnpm@${{ steps.runtime.outputs.pm_version }}" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "${{ steps.runtime.outputs.pm_version }}"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"

      - name: Reconstruct frozen case and retain diagnostic checkout
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/run.mjs \
            --case "$CASE_ID" \
            --manifest benchmarks/manifest.json \
            --ascout-root . \
            --run-id "t091-diagnostic-${GITHUB_RUN_ID}" \
            --repetitions 2 \
            --keep-temp \
            --output out/t075-diagnostic.json \
            > out/t075-stdout.json \
            2> out/t075-stderr.txt
          temp_root="$(sed -n 's/^T075_TEMP_ROOT=//p' out/t075-stderr.txt | tail -n 1)"
          test -n "$temp_root"
          test -d "$temp_root"
          echo "temp_root=$temp_root" >> "$GITHUB_OUTPUT"

      - name: Inspect persisted Ascout Jest diagnostics
        shell: bash
        env:
          TEMP_ROOT: ${{ steps.replay.outputs.temp_root }}
        run: |
          set -euo pipefail
          mkdir -p out/ascout-diagnostics
          mapfile -t stderr_files < <(find "$TEMP_ROOT" -type f -path '*/.ascout/runs/*/raw/test-stderr.log' | sort)
          mapfile -t stdout_files < <(find "$TEMP_ROOT" -type f -path '*/.ascout/runs/*/raw/test-stdout.log' | sort)
          mapfile -t root_lcov < <(find "$TEMP_ROOT" -type f -path '*/.ascout/runs/*/raw/test/coverage/lcov.info' | sort)
          mapfile -t nested_lcov < <(find "$TEMP_ROOT" -type f -path '*/scripts/jest/.ascout/runs/*/raw/test/coverage/lcov.info' | sort)
          printf 'stderr_count=%s\nstdout_count=%s\nroot_lcov_count=%s\nnested_lcov_count=%s\n' \
            "${#stderr_files[@]}" "${#stdout_files[@]}" "${#root_lcov[@]}" "${#nested_lcov[@]}" \
            | tee out/ascout-diagnostics/path-counts.txt
          test "${#stderr_files[@]}" -ge 1
          for index in "${!stderr_files[@]}"; do
            file="${stderr_files[$index]}"
            cp "$file" "out/ascout-diagnostics/test-stderr-${index}.log"
            echo "--- persisted test stderr ${index} ---"
            sed -n '1,260p' "$file"
          done
          for index in "${!stdout_files[@]}"; do
            cp "${stdout_files[$index]}" "out/ascout-diagnostics/test-stdout-${index}.log"
          done
          find "$TEMP_ROOT" -type f \( -path '*/.ascout/runs/*/raw/test/jest-results.json' -o -path '*/scripts/jest/.ascout/runs/*/raw/test/jest-results.json' \) \
            -print | sort | tee out/ascout-diagnostics/jest-result-paths.txt
          find "$TEMP_ROOT" -type f -path '*/lcov.info' -print | sort | tee out/ascout-diagnostics/lcov-paths.txt

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: t091-rhf-diagnostic
          path: out/
          if-no-files-found: error
          retention-days: 7
