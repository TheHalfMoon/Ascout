name: T091 Requalification

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: read

env:
  ASCOUT_CONTROLLER_NODE: 24.15.0
  EXPECTED_T078_SHA256: 2c62cd54c5700fa76ffbcf549390d4695a2f76f4afd46a521207065d261cf2a5

jobs:
  focused-rhf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_digest: ${{ steps.focused-upload.outputs.artifact-digest }}
    env:
      CASE_ID: react-hook-form-value-as-date
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm
      - name: Install build and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          ./node_modules/.bin/vitest run tests/t091-pnpm-settings-only-workspace.contract.test.ts tests/t089-nested-runner-config.contract.test.ts tests/discovery-hardening.contract.test.ts
          npm run build
      - name: Read frozen donor Node
        id: runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const c = m.cases.find((x) => x.case_id === process.env.CASE_ID);
          if (!c || c.case_class !== 'selection' || c.runtime.package_manager !== 'pnpm') process.exit(2);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${c.runtime.node_version}\n`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install exact frozen pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM_VERSION="$(node -e 'const m=require("./benchmarks/manifest.json"); const c=m.cases.find(x=>x.case_id===process.env.CASE_ID); process.stdout.write(c.runtime.package_manager_version)')"
          npm install --global --force "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "$PM_VERSION"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"
      - name: Replay focused frozen benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/metrics.mjs --case "$CASE_ID" --manifest benchmarks/manifest.json --ascout-root . --run-id "t091-focused-${GITHUB_RUN_ID}" --repetitions 2 --output out/focused.metrics.json
          node benchmarks/assertions.mjs --input out/focused.metrics.json --output out/focused.assertions.json
          node <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const metrics = JSON.parse(fs.readFileSync('out/focused.metrics.json', 'utf8'));
          const c = m.cases.find((x) => x.case_id === process.env.CASE_ID);
          const required = [...c.oracle.specification.regression_test_ids].sort();
          const ascout = metrics.metrics?.selection_recall?.ascout;
          if (!ascout || ascout.available !== true || ascout.recall !== 1) throw new Error('focused Ascout oracle membership not proven');
          const observed = [...ascout.observed_oracle_test_ids].sort();
          for (const id of required) if (!observed.includes(id)) throw new Error(`missing oracle test: ${id}`);
          fs.writeFileSync('out/focused-proof.json', JSON.stringify({schema_version:1, task:'T091', candidate_sha:process.env.GITHUB_SHA, qualification_run_id:process.env.GITHUB_RUN_ID, case_id:c.case_id, case_revision:c.case_revision, required_oracle_test_ids:required, observed_oracle_test_ids:observed, ascout_recall:ascout.recall, ascout_oracle_membership:'PROVEN'}, null, 2) + '\n');
          NODE
      - name: Upload focused evidence
        id: focused-upload
        uses: actions/upload-artifact@v4
        with:
          name: t091-requal-focused-rhf
          path: out/
          if-no-files-found: error
          retention-days: 14

  selection-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case_id:
          - zod-scientific-exponents
          - zod-jitless-allows-eval
          - tanstack-streamed-query-reducer
          - zustand-persist-latest-state
          - react-hook-form-value-as-date
          - trpc-streaming-onerror-cause
    env:
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm
      - name: Install and build Ascout
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Read frozen donor Node
        id: runtime
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const m = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const c = m.cases.find((x) => x.case_id === process.env.CASE_ID);
          if (!c || c.case_class !== 'selection' || c.runtime.package_manager !== 'pnpm') process.exit(2);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${c.runtime.node_version}\n`);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}
      - name: Install exact frozen pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM_VERSION="$(node -e 'const m=require("./benchmarks/manifest.json"); const c=m.cases.find(x=>x.case_id===process.env.CASE_ID); process.stdout.write(c.runtime.package_manager_version)')"
          npm install --global --force "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "$PM_VERSION"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"
      - name: Replay frozen selection case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/metrics.mjs --case "$CASE_ID" --manifest benchmarks/manifest.json --ascout-root . --run-id "t091-${CASE_ID}-${GITHUB_RUN_ID}" --repetitions 2 --output "out/${CASE_ID}.metrics.json"
          node benchmarks/assertions.mjs --input "out/${CASE_ID}.metrics.json" --output "out/${CASE_ID}.assertions.json"
      - uses: actions/upload-artifact@v4
        with:
          name: t091-requal-case-${{ matrix.case_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [focused-rhf, selection-corpus]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
      - uses: actions/download-artifact@v4
        with:
          pattern: t091-requal-case-*
          path: case-results
          merge-multiple: true
      - name: Aggregate and guard historical evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cases
          mapfile -t metric_files < <(find case-results -type f -name '*.metrics.json' | sort)
          mapfile -t assertion_files < <(find case-results -type f -name '*.assertions.json' | sort)
          test "${#metric_files[@]}" -eq 6
          test "${#assertion_files[@]}" -eq 6
          metric_args=(); for f in "${metric_files[@]}"; do metric_args+=(--aggregate-input "$f"); cp "$f" out/cases/; done
          assertion_args=(); for f in "${assertion_files[@]}"; do assertion_args+=(--aggregate-input "$f"); cp "$f" out/cases/; done
          node benchmarks/metrics.mjs "${metric_args[@]}" --output out/t091-t076-aggregate.json
          node benchmarks/assertions.mjs "${assertion_args[@]}" --output out/t091-t077-assertions.json
          T078_SHA="$(sha256sum benchmarks/results/t078-selector-misses.json | awk '{print $1}')"
          test "$T078_SHA" = "$EXPECTED_T078_SHA256"
          T076_SHA="$(sha256sum out/t091-t076-aggregate.json | awk '{print $1}')"
          T077_SHA="$(sha256sum out/t091-t077-assertions.json | awk '{print $1}')"
          printf '%s\n' "$T076_SHA" > out/t076.sha256
          printf '%s\n' "$T077_SHA" > out/t077.sha256
          printf '%s\n' "$T078_SHA" > out/t078.sha256
      - name: Upload aggregate inputs
        id: aggregate-upload
        uses: actions/upload-artifact@v4
        with:
          name: t091-requal-aggregate-inputs
          path: out/
          if-no-files-found: error
          retention-days: 14
      - name: Prove selector truth
        shell: bash
        env:
          AGGREGATE_ARTIFACT_DIGEST: ${{ steps.aggregate-upload.outputs.artifact-digest }}
          FOCUSED_ARTIFACT_DIGEST: ${{ needs.focused-rhf.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          T076_SHA="$(cat out/t076.sha256)"
          T077_SHA="$(cat out/t077.sha256)"
          node benchmarks/misses.mjs --input out/t091-t076-aggregate.json --qualification-run-id "$GITHUB_RUN_ID" --t076-aggregate-sha256 "$T076_SHA" --t077-aggregate-sha256 "$T077_SHA" --aggregate-artifact-digest "sha256:${AGGREGATE_ARTIFACT_DIGEST}" --output out/t091-selector-truth.json
          node <<'NODE'
          const fs = require('node:fs');
          const assertions = JSON.parse(fs.readFileSync('out/t091-t077-assertions.json','utf8'));
          const truth = JSON.parse(fs.readFileSync('out/t091-selector-truth.json','utf8'));
          if (assertions.status !== 'ABSOLUTE_ASSERTIONS_SATISFIED') throw new Error(`absolute assertions status: ${assertions.status}`);
          if (truth.summary.selection_case_count !== 6) throw new Error(`selection count: ${truth.summary.selection_case_count}`);
          if (truth.selector_misses.length !== 0) throw new Error(`selector misses: ${truth.selector_misses.length}`);
          fs.writeFileSync('out/requalification-summary.json', JSON.stringify({schema_version:1, task:'T091', status:'M2_SELECTION_REPLAY_QUALIFIED', qualification_head:process.env.GITHUB_SHA, qualification_run_id:process.env.GITHUB_RUN_ID, focused_artifact_digest:`sha256:${process.env.FOCUSED_ARTIFACT_DIGEST}`, aggregate_artifact_digest:`sha256:${process.env.AGGREGATE_ARTIFACT_DIGEST}`, selector_summary:truth.summary, selector_misses:truth.selector_misses, selector_unavailable:truth.selector_unavailable, absolute_assertions_status:assertions.status, t076_aggregate_sha256:fs.readFileSync('out/t076.sha256','utf8').trim(), t077_assertions_sha256:fs.readFileSync('out/t077.sha256','utf8').trim(), historical_t078_sha256:fs.readFileSync('out/t078.sha256','utf8').trim()}, null, 2) + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: t091-requal-evidence
          path: out/
          if-no-files-found: error
          retention-days: 14
