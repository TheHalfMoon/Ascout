name: T091 Focused RHF Qualification

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: read

env:
  CASE_ID: react-hook-form-value-as-date
  ASCOUT_CONTROLLER_NODE: 24.15.0

jobs:
  focused-rhf:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""

      - name: Set up controller Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm

      - name: Install build and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          ./node_modules/.bin/vitest run \
            tests/t091-pnpm-settings-only-workspace.contract.test.ts \
            tests/t089-nested-runner-config.contract.test.ts \
            tests/discovery-hardening.contract.test.ts
          npm run build

      - name: Read frozen donor runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'selection') throw new Error('focused selection case is unavailable');
          if (item.runtime.package_manager !== 'pnpm') throw new Error(`unexpected package manager: ${item.runtime.package_manager}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${item.runtime.node_version}\npm_version=${item.runtime.package_manager_version}\nrevision=${item.case_revision}\n`);
          NODE

      - name: Set up frozen donor Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install exact frozen pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --force "pnpm@${{ steps.runtime.outputs.npm_version }}" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "${{ steps.runtime.outputs.npm_version }}"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"

      - name: Replay focused frozen benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/metrics.mjs \
            --case "$CASE_ID" \
            --manifest benchmarks/manifest.json \
            --ascout-root . \
            --run-id "t091-focused-${GITHUB_RUN_ID}" \
            --repetitions 2 \
            --output out/focused.metrics.json
          node benchmarks/assertions.mjs \
            --input out/focused.metrics.json \
            --output out/focused.assertions.json

      - name: Prove repaired Ascout oracle membership
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const metrics = JSON.parse(fs.readFileSync('out/focused.metrics.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          const required = [...item.oracle.specification.regression_test_ids].sort();
          const ascout = metrics.metrics?.selection_recall?.ascout;
          if (!ascout || ascout.available !== true) throw new Error('Ascout selection membership is unavailable');
          const observed = [...ascout.observed_oracle_test_ids].sort();
          for (const oracleId of required) {
            if (!observed.includes(oracleId)) throw new Error(`missing frozen oracle test: ${oracleId}`);
          }
          if (ascout.recall !== 1) throw new Error(`focused Ascout recall is ${ascout.recall}`);
          fs.writeFileSync('out/focused-oracle-proof.json', JSON.stringify({
            schema_version: 1,
            task: 'T091',
            candidate_sha: process.env.GITHUB_SHA,
            qualification_run_id: process.env.GITHUB_RUN_ID,
            case_id: item.case_id,
            case_revision: item.case_revision,
            required_oracle_test_ids: required,
            observed_oracle_test_ids: observed,
            ascout_recall: ascout.recall,
            ascout_oracle_membership: 'PROVEN'
          }, null, 2) + '\n');
          NODE

      - name: Upload focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: t091-focused-rhf
          path: out/
          if-no-files-found: error
          retention-days: 14
