name: T091 Full Selection Corpus Qualification

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: read

env:
  ASCOUT_CONTROLLER_NODE: 24.15.0
  EXPECTED_T078_SHA256: 2c62cd54c5700fa76ffbcf549390d4695a2f76f4afd46a521207065d261cf2a5

jobs:
  selection-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case_id:
          - zod-scientific-exponents
          - zod-jitless-allows-eval
          - tanstack-streamed-query-reducer
          - zustand-persist-latest-state
          - react-hook-form-value-as-date
          - trpc-streaming-onerror-cause
    env:
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git status --short)" = ""

      - name: Set up controller Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm

      - name: Install and build Ascout
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Read frozen donor Node
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'selection') throw new Error(`selection case not found: ${process.env.CASE_ID}`);
          if (item.runtime.package_manager !== 'pnpm') throw new Error(`unexpected package manager: ${item.runtime.package_manager}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${item.runtime.node_version}\n`);
          NODE

      - name: Set up frozen donor Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Install exact frozen pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM_VERSION="$(node -e 'const m=require("./benchmarks/manifest.json"); const c=m.cases.find(x=>x.case_id===process.env.CASE_ID); if(!c) process.exit(2); process.stdout.write(c.runtime.package_manager_version)')"
          test -n "$PM_VERSION"
          npm install --global --force "pnpm@$PM_VERSION" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "$PM_VERSION"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"

      - name: Replay frozen selection case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/metrics.mjs \
            --case "$CASE_ID" \
            --manifest benchmarks/manifest.json \
            --ascout-root . \
            --run-id "t091-${CASE_ID}-${GITHUB_RUN_ID}" \
            --repetitions 2 \
            --output "out/${CASE_ID}.metrics.json"
          node benchmarks/assertions.mjs \
            --input "out/${CASE_ID}.metrics.json" \
            --output "out/${CASE_ID}.assertions.json"

      - name: Upload case evidence
        uses: actions/upload-artifact@v4
        with:
          name: t091-case-${{ matrix.case_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: selection-corpus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}

      - name: Download case evidence
        uses: actions/download-artifact@v4
        with:
          pattern: t091-case-*
          path: case-results
          merge-multiple: true

      - name: Aggregate metrics and absolute assertions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cases
          mapfile -t metric_files < <(find case-results -type f -name '*.metrics.json' | sort)
          mapfile -t assertion_files < <(find case-results -type f -name '*.assertions.json' | sort)
          test "${#metric_files[@]}" -eq 6
          test "${#assertion_files[@]}" -eq 6

          metric_args=()
          for file in "${metric_files[@]}"; do
            metric_args+=(--aggregate-input "$file")
            cp "$file" out/cases/
          done
          node benchmarks/metrics.mjs "${metric_args[@]}" --output out/t091-t076-aggregate.json

          assertion_args=()
          for file in "${assertion_files[@]}"; do
            assertion_args+=(--aggregate-input "$file")
            cp "$file" out/cases/
          done
          node benchmarks/assertions.mjs "${assertion_args[@]}" --output out/t091-t077-assertions.json

          t078_sha="$(sha256sum benchmarks/results/t078-selector-misses.json | awk '{print $1}')"
          test "$t078_sha" = "$EXPECTED_T078_SHA256"
          sha256sum out/t091-t076-aggregate.json | awk '{print $1}' > out/t076.sha256
          sha256sum out/t091-t077-assertions.json | awk '{print $1}' > out/t077.sha256
          printf '%s\n' "$t078_sha" > out/t078.sha256

      - name: Upload aggregate inputs
        id: aggregate-upload
        uses: actions/upload-artifact@v4
        with:
          name: t091-aggregate-inputs
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Publish replay truth inside evidence bundle
        shell: bash
        env:
          AGGREGATE_ARTIFACT_DIGEST: ${{ steps.aggregate-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          T076_SHA="$(cat out/t076.sha256)"
          T077_SHA="$(cat out/t077.sha256)"
          T078_SHA="$(cat out/t078.sha256)"
          node benchmarks/misses.mjs \
            --input out/t091-t076-aggregate.json \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --t076-aggregate-sha256 "$T076_SHA" \
            --t077-aggregate-sha256 "$T077_SHA" \
            --aggregate-artifact-digest "sha256:${AGGREGATE_ARTIFACT_DIGEST}" \
            --output out/t091-selector-truth.json

          node <<'NODE'
          const fs = require('node:fs');
          const aggregate = JSON.parse(fs.readFileSync('out/t091-t076-aggregate.json', 'utf8'));
          const assertions = JSON.parse(fs.readFileSync('out/t091-t077-assertions.json', 'utf8'));
          const truth = JSON.parse(fs.readFileSync('out/t091-selector-truth.json', 'utf8'));
          const historical = JSON.parse(fs.readFileSync('benchmarks/results/t078-selector-misses.json', 'utf8'));
          const t076Sha = fs.readFileSync('out/t076.sha256', 'utf8').trim();
          const t077Sha = fs.readFileSync('out/t077.sha256', 'utf8').trim();
          const t078Sha = fs.readFileSync('out/t078.sha256', 'utf8').trim();
          if (assertions.status !== 'ABSOLUTE_ASSERTIONS_SATISFIED') throw new Error(`absolute assertions status: ${assertions.status}`);
          if (truth.summary.selection_case_count !== 6) throw new Error(`selection case count: ${truth.summary.selection_case_count}`);
          if (truth.selector_misses.length !== 0) throw new Error(`selector misses remain: ${truth.selector_misses.length}`);
          const result = {
            schema_version: 1,
            task: 'T091',
            status: 'M2_SELECTION_REPLAY_QUALIFIED',
            qualification_head: process.env.GITHUB_SHA,
            qualification_run_id: process.env.GITHUB_RUN_ID,
            product_repair_commit: '979d8fecc260f1aa428dfc9020e0e3d8e1d42af9',
            corpus: {
              kind: 'founding_selection',
              case_count: truth.summary.selection_case_count,
              case_set: truth.selection_case_set
            },
            focused_replay: {
              case_id: 'react-hook-form-value-as-date',
              case_revision: 2,
              qualification_head: '58af5f4fd034c16798b9d27ea57b0fcf07236c7c',
              qualification_run_id: '33406629285',
              artifact_digest: 'sha256:50070ba9f8c5fc3f238f0bfeb3db765ffd83c80893ccf4ad72d59919e4036ec9',
              ascout_oracle_membership: 'PROVEN'
            },
            current_replay: {
              t076_aggregate_sha256: t076Sha,
              t077_assertions_sha256: t077Sha,
              aggregate_artifact_digest: `sha256:${process.env.AGGREGATE_ARTIFACT_DIGEST}`,
              selector_summary: truth.summary,
              selector_misses: truth.selector_misses,
              selector_unavailable: truth.selector_unavailable,
              absolute_assertions_status: assertions.status,
              aggregate_status: aggregate.status ?? null
            },
            historical_evidence: {
              path: 'benchmarks/results/t078-selector-misses.json',
              sha256: t078Sha,
              prior_published_selector_miss_count: historical.summary.published_selector_miss_count,
              overwritten: false
            },
            constraints: {
              product_repair_is_within_t091_single_package_config_fidelity_scope: true,
              frozen_benchmark_semantics_modified: false,
              historical_result_overwritten: false,
              unavailable_evidence_invented: false,
              release_or_publish_performed: false
            }
          };
          fs.writeFileSync('out/t091-m2-selection-replay.json', JSON.stringify(result, null, 2) + '\n');
          NODE

      - name: Upload T091 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: t091-m2-evidence
          path: out/
          if-no-files-found: error
          retention-days: 14
