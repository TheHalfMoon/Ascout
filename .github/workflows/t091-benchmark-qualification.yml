name: T091 Benchmark Qualification

on:
  push:
    branches:
      - feat/091-m2-benchmark-replay

permissions:
  contents: read

concurrency:
  group: t091-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  ASCOUT_CONTROLLER_NODE: 24.15.0
  EXPECTED_T078_SHA256: 2c62cd54c5700fa76ffbcf549390d4695a2f76f4afd46a521207065d261cf2a5

jobs:
  focused-react-hook-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      CASE_ID: react-hook-form-value-as-date
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up controller Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm

      - name: Install and build Ascout
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Read frozen case runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'selection') throw new Error(`selection case not found: ${process.env.CASE_ID}`);
          if (item.runtime.package_manager !== 'pnpm') throw new Error(`unexpected package manager: ${item.runtime.package_manager}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${item.runtime.node_version}\npm_version=${item.runtime.package_manager_version}\ncase_revision=${item.case_revision}\n`);
          NODE

      - name: Set up frozen donor Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Set up frozen donor package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --force "pnpm@${{ steps.runtime.outputs.pm_version }}" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "${{ steps.runtime.outputs.pm_version }}"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"

      - name: Replay focused React Hook Form case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/metrics.mjs \
            --case "$CASE_ID" \
            --manifest benchmarks/manifest.json \
            --ascout-root . \
            --run-id "t091-focused-${GITHUB_RUN_ID}" \
            --repetitions 2 \
            --output out/focused-react-hook-form.metrics.json
          node benchmarks/assertions.mjs \
            --input out/focused-react-hook-form.metrics.json \
            --output out/focused-react-hook-form.assertions.json

      - name: Prove Ascout executed the frozen oracle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const metrics = JSON.parse(fs.readFileSync('out/focused-react-hook-form.metrics.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          const required = [...item.oracle.specification.regression_test_ids].sort();
          const ascout = metrics.metrics?.selection_recall?.ascout;
          if (!ascout || ascout.available !== true) throw new Error('Ascout selection membership is unavailable for the focused case');
          const observed = [...ascout.observed_oracle_test_ids].sort();
          for (const oracleId of required) {
            if (!observed.includes(oracleId)) throw new Error(`Ascout did not execute frozen oracle test: ${oracleId}`);
          }
          fs.writeFileSync('out/focused-oracle-proof.json', JSON.stringify({
            schema_version: 1,
            task: 'T091',
            case_id: item.case_id,
            case_revision: item.case_revision,
            required_oracle_test_ids: required,
            observed_oracle_test_ids: observed,
            ascout_oracle_membership: 'PROVEN',
          }, null, 2) + '\n');
          NODE

      - name: Upload focused qualification evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: t091-focused-react-hook-form
          path: out/
          if-no-files-found: error
          retention-days: 14

  selection-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case_id:
          - zod-scientific-exponents
          - zod-jitless-allows-eval
          - tanstack-streamed-query-reducer
          - zustand-persist-latest-state
          - react-hook-form-value-as-date
          - trpc-streaming-onerror-cause
    env:
      CASE_ID: ${{ matrix.case_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up controller Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}
          cache: npm

      - name: Install and build Ascout
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Read frozen case runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('benchmarks/manifest.json', 'utf8'));
          const item = manifest.cases.find((candidate) => candidate.case_id === process.env.CASE_ID);
          if (!item || item.case_class !== 'selection') throw new Error(`selection case not found: ${process.env.CASE_ID}`);
          if (item.runtime.package_manager !== 'pnpm') throw new Error(`unexpected package manager: ${item.runtime.package_manager}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${item.runtime.node_version}\npm_version=${item.runtime.package_manager_version}\ncase_revision=${item.case_revision}\n`);
          NODE

      - name: Set up frozen donor Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.runtime.outputs.node }}

      - name: Set up frozen donor package manager
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --force "pnpm@${{ steps.runtime.outputs.pm_version }}" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "${{ steps.runtime.outputs.pm_version }}"
          test "$(node --version | sed 's/^v//')" = "${{ steps.runtime.outputs.node }}"

      - name: Replay frozen selection case
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node benchmarks/metrics.mjs \
            --case "$CASE_ID" \
            --manifest benchmarks/manifest.json \
            --ascout-root . \
            --run-id "t091-${CASE_ID}-${GITHUB_RUN_ID}" \
            --repetitions 2 \
            --output "out/${CASE_ID}.metrics.json"
          node benchmarks/assertions.mjs \
            --input "out/${CASE_ID}.metrics.json" \
            --output "out/${CASE_ID}.assertions.json"

      - name: Upload case evidence
        uses: actions/upload-artifact@v4
        with:
          name: t091-case-${{ matrix.case_id }}
          path: out/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - focused-react-hook-form
      - selection-corpus
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up controller Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.ASCOUT_CONTROLLER_NODE }}

      - name: Download selection evidence
        uses: actions/download-artifact@v4
        with:
          pattern: t091-case-*
          path: case-results
          merge-multiple: true

      - name: Aggregate current metrics and absolute assertions
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/cases
          mapfile -t metric_files < <(find case-results -type f -name '*.metrics.json' | sort)
          mapfile -t assertion_files < <(find case-results -type f -name '*.assertions.json' | sort)
          test "${#metric_files[@]}" -eq 6
          test "${#assertion_files[@]}" -eq 6

          metric_args=()
          for file in "${metric_files[@]}"; do
            metric_args+=(--aggregate-input "$file")
            cp "$file" out/cases/
          done
          node benchmarks/metrics.mjs "${metric_args[@]}" --output out/t091-t076-aggregate.json

          assertion_args=()
          for file in "${assertion_files[@]}"; do
            assertion_args+=(--aggregate-input "$file")
            cp "$file" out/cases/
          done
          node benchmarks/assertions.mjs "${assertion_args[@]}" --output out/t091-t077-assertions.json

          t076_sha="$(sha256sum out/t091-t076-aggregate.json | awk '{print $1}')"
          t077_sha="$(sha256sum out/t091-t077-assertions.json | awk '{print $1}')"
          t078_sha="$(sha256sum benchmarks/results/t078-selector-misses.json | awk '{print $1}')"
          test "$t078_sha" = "$EXPECTED_T078_SHA256"
          echo "t076_sha=$t076_sha" >> "$GITHUB_OUTPUT"
          echo "t077_sha=$t077_sha" >> "$GITHUB_OUTPUT"
          echo "t078_sha=$t078_sha" >> "$GITHUB_OUTPUT"

      - name: Upload aggregate qualification inputs
        id: aggregate-upload
        uses: actions/upload-artifact@v4
        with:
          name: t091-aggregate-inputs
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Publish replay selector truth and T091 evidence
        shell: bash
        env:
          T076_SHA: ${{ steps.aggregate.outputs.t076_sha }}
          T077_SHA: ${{ steps.aggregate.outputs.t077_sha }}
          T078_SHA: ${{ steps.aggregate.outputs.t078_sha }}
          AGGREGATE_ARTIFACT_DIGEST: ${{ steps.aggregate-upload.outputs.artifact-digest }}
          FOCUSED_ARTIFACT_DIGEST: ${{ needs.focused-react-hook-form.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          node benchmarks/misses.mjs \
            --input out/t091-t076-aggregate.json \
            --qualification-run-id "$GITHUB_RUN_ID" \
            --t076-aggregate-sha256 "$T076_SHA" \
            --t077-aggregate-sha256 "$T077_SHA" \
            --aggregate-artifact-digest "sha256:${AGGREGATE_ARTIFACT_DIGEST}" \
            --output out/t091-selector-truth.json

          node <<'NODE'
          const fs = require('node:fs');
          const aggregate = JSON.parse(fs.readFileSync('out/t091-t076-aggregate.json', 'utf8'));
          const assertions = JSON.parse(fs.readFileSync('out/t091-t077-assertions.json', 'utf8'));
          const selectorTruth = JSON.parse(fs.readFileSync('out/t091-selector-truth.json', 'utf8'));
          if (assertions.status !== 'ABSOLUTE_ASSERTIONS_SATISFIED') throw new Error(`absolute assertions are not satisfied: ${assertions.status}`);
          const evidence = {
            schema_version: 1,
            task: 'T091',
            status: 'M2_SELECTION_REPLAY_QUALIFIED',
            candidate_sha: process.env.GITHUB_SHA,
            qualification_run_id: process.env.GITHUB_RUN_ID,
            corpus: {
              kind: 'founding_selection',
              case_count: selectorTruth.summary.selection_case_count,
              case_set: selectorTruth.selection_case_set,
            },
            focused_replay: {
              case_id: 'react-hook-form-value-as-date',
              case_revision: 2,
              ascout_oracle_membership: 'PROVEN',
              artifact_digest: `sha256:${process.env.FOCUSED_ARTIFACT_DIGEST}`,
            },
            current_replay: {
              t076_aggregate_sha256: process.env.T076_SHA,
              t077_assertions_sha256: process.env.T077_SHA,
              aggregate_artifact_digest: `sha256:${process.env.AGGREGATE_ARTIFACT_DIGEST}`,
              selector_summary: selectorTruth.summary,
              selector_misses: selectorTruth.selector_misses,
              selector_unavailable: selectorTruth.selector_unavailable,
              absolute_assertions_status: assertions.status,
              aggregate_status: aggregate.status ?? null,
            },
            historical_evidence: {
              path: 'benchmarks/results/t078-selector-misses.json',
              sha256: process.env.T078_SHA,
              overwritten: false,
            },
            constraints: {
              no_product_mutation_for_replay: true,
              no_historical_result_overwrite: true,
              no_release_or_publish: true,
            },
          };
          fs.writeFileSync('out/t091-m2-selection-replay.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Upload T091 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: t091-m2-evidence
          path: out/
          if-no-files-found: error
          retention-days: 14
